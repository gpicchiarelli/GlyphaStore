  - Generazioni condivise o ritirate e cache dell'allocatore non incluse nel censimento corrente
  - Segment mapping, stack e overhead di allocazione confusi con payload logico
  conseguenze:
  - OOM, pressione di memoria e jitter di latenza su dataset o shard count elevati
  - Dimensionamento operativo basato su un rapporto bytes-per-key non credibile
  severita: alta
  probabilita: alta
  rilevabilita: media
  prevenzione:
  - Layout base compatto con 5 byte per bucket e Record immutabile da 64 byte
  - Mapping anonime guarded per i grandi array Record, classi geometriche e un solo spare bounded
    per lineage; nessun lock nel GET o nella publication Delta ordinaria
  - Censimento coerente O(1), con conteggi esatti page/block/chunk aggiornati dal solo Writer, e
    benchmark RSS separato
  - Limiti esistenti su delta, generazioni ritirate, merge post-cut, lane e buffer connessione
  contenimento:
  - Conservare il claim di prototipo e dimensionare con RSS/peak RSS nativi, non col solo payload logico
  - Applicare backpressure sui limiti esistenti e ridurre shard/dataset quando il budget non e provato
