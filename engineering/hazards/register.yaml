- id: HAZ-029
  evento_pericoloso: Deriva o contaminazione della C ABI pubblica
  cause:
  - Rimozione o modifica silenziosa di un simbolo ABI 1
  - Esportazione accidentale di simboli C++ o server interni
  - Cambio di layout o semantica senza ABI major bump
  conseguenze:
  - Crash o corruzione nei consumer già compilati
  - Impossibilità di upgrade sicuro della shared library
  severita: alta
  probabilita: media
  rilevabilita: alta
  prevenzione:
  - ABI_VERSION separato e ADR 0038
  - Visibility hidden, allowlist esatta e static assertion di layout
  - Consumer C esterno sigillato e matrice bidirezionale su release precedente attestata
