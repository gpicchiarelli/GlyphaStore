  - Invocazioni duplicate di housekeeping nello stesso turno del combiner
  - Transizione delta-ready rinviata quando l'ultimo slot coincide esattamente col budget
  conseguenze:
  - Jitter elevato della latenza PUT e head-of-line blocking del Writer
  - Esaurimento del post-delta seguito da retry concentrati o rifiuto prima dello Store
  - Merge non avviato quando l'ultimo batch raggiunge la soglia e il Writer dedicato diventa idle
  severita: alta
  probabilita: media
  rilevabilita: alta
  prevenzione:
  - Budget proporzionale ceil(debito residuo per record entranti diviso capacita post-cut residua)
  - Un quantum minimo per PUT singolo e due quantum ammortizzati per publication coalesciata, senza
    crescita lineare controllata dal batch client
  - Transizioni initialize-base-delta-ready gratuite rispetto al conteggio degli slot
  - Turno idle del Writer dedicato successivo agli ACK, con rilascio del token fra quantum
  contenimento:
  - Conservare bounds di delta e post-delta e rifiutare prima dello Store solo se l'ammissione resta
    impossibile dopo l'avanzamento proporzionale
  - Osservare debito, capacita residua, massimo quantum e backpressure per shard
