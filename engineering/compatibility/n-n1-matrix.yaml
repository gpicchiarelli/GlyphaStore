# N↔N-1 compatibility matrix (Phase D).
# Authority for supported / intentionally rejected / not-promised combinations.
# Validator: engineering/tools/validate_compat_matrix.py

version: 1
current_line: "0.1.x"
persistence_format: 1
wire_protocol: 2

# Store open (durable data directory reopen / offline tools)
store_open:
  - id: STORE-SAME-LINE
    writer: "0.1.x"
    reader: "0.1.x"
    status: supported
    conditions:
      - persistence_format_v1
      - unchanged_worker_count
    evidence:
      - tests/fixtures/released/self-v1
      - workflow: release-compat.yml
    notes: Same-directory reopen across 0.1.x binaries that implement Manifest/Segment/Record v1.

  - id: STORE-WORKER-RESHARD
    writer: "0.1.x"
    reader: "0.1.x"
    status: supported_offline_only
    conditions:
      - offline_glyphastore_migrate_store
      - new_destination_directory
    evidence:
      - docs/adr/0024-offline-worker-migration.md
      - tests/unit/store_migrate_tests.cpp
    notes: Worker-count changes require offline migrate into a new Store; in-place reopen is refused.
      Checkpoint resume and fail-closed mismatch/corrupt cases are covered in unit tests
      (requirement GS-OPS-MIGRATE-001).

  - id: STORE-PRE-V1
    writer: "pre-v1"
    reader: "0.1.x"
    status: unsupported
    notes: No legacy persistent format was released; pre-v1 artifacts are rejected.

  - id: STORE-FUTURE-REQUIRED
    writer: "future-required-version"
    reader: "0.1.x"
    status: intentionally_rejected
    evidence:
      - tests/unit/store_backup_tests.cpp
    notes: Newer required format versions fail closed; no automatic downgrade rewrite.
      Synthetic checksum-valid Manifest v2 and future pinned Record version refuse
      verify/restore/open (HAZ-022).

  - id: STORE-DOWNGRADE-REWRITE
    writer: "0.1.x"
    reader: "older-than-writer-required"
    status: not_promised
    notes: Downgrade export / salvage are separate operator workflows, not silent reopen.

# Wire server ↔ client (native protocol)
wire:
  - id: WIRE-V2-SAME
    server: "0.1.x"
    client: "0.1.x"
    status: supported
    conditions:
      - wire_protocol_v2
    evidence:
      - tests/fixtures/wire_requests_v2.hex
      - tests/fixtures/wire_responses_v2.hex
      - workflow: ci.yml
    notes: Exact wire v2 only; unknown flags/reserved rejected.

  - id: WIRE-V1-OR-UNKNOWN
    server: "0.1.x"
    client: "non-v2"
    status: intentionally_rejected
    notes: Non-v2 frames are rejected before service.

  - id: WIRE-CROSS-MAJOR-FUTURE
    server: "future-major"
    client: "0.1.x"
    status: not_promised
    notes: Cross-major wire compatibility is not promised until an explicit matrix row and fixtures exist.

# ABI / installed C++ package
abi:
  - id: ABI-0X-NO-STABLE
    status: not_promised
    notes: No ABI stability before 1.0; SemVer SameMinorVersion for 0.x CMake package version file.

released_fixture_policy:
  artifact_schema: 2
  in_tree_labels:
    - self-v1
  permanent_drop: tests/fixtures/released/<label>/
  packaging_script: scripts/package-release-compatibility-artifacts.sh
  ci_workflow: release-compat.yml
  residual: >
    Committing prior-release N-1 trees into the permanent fixture drop remains a
    release-process step when tags exist; until then the matrix documents policy
    and self-v1 / per-SHA CI packaging prove the harness.

sdk_artifact_policy:
  contract: engineering/compatibility/sdk-release-contract.json
  generated_index: sdk-release-index.json
  index_writer: engineering/tools/write_sdk_release_index.py
  compatibility_evidence: not-inferred-from-index
  residual: >
    The index makes a prior release machine-selectable but does not prove old-client/new-server
    behavior until at least one prior official SDK release exists and the cross-version matrix runs.
