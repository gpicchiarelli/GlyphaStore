requirements:
- id: GS-OPS-CONFIG-001
  titolo: Configuration precedence validation and safe defaults
  categoria: operations
  criticita: alta
  stato: provato
  descrizione: Daemon and embedded durable config have documented precedence, validation, safe defaults,
    and resource limits; production profile fails closed before listen.
  autorita:
  - docs/cli.md
  - docs/operations/durable-tcp-daemon.md
  implementazione:
  - src/cli
  - src/persistence/resource_limits.cpp
  - src/main.cpp
  prove:
  - tests/integration/store_tests.cpp
  - tests/unit/maintenance_controller_tests.cpp
  - tests/integration/compaction_builder_tests.cpp
  - scripts/exercise_ops_runbooks.sh
  piattaforme:
  - linux-x86_64
  - macos-arm64
  claim_massimo: architectural-prototype
  evidenze:
  - workflow: ops-runbooks.yml
  - workflow: ci.yml
  rischio_residuo:
  - Misconfiguration on unsupported filesystems remains an operator hazard
  - Multi-hour adversarial reclaim fairness soak remains open
  hazards:
  - HAZ-025
  - HAZ-026
  gates:
  - GATE-CONFIG
- id: GS-OPS-BACKUP-001
  titolo: Backup restore verify and online fence
  categoria: operations
  criticita: alta
  stato: implementato
  descrizione: Offline backup/restore/verify/repair and online fenced Store::backup_to are implemented;
    released-tag artifact consumption remains open.
  autorita:
  - docs/operations/backup-restore.md
  - docs/architecture/backup-restore.md
  - docs/spec/backup-restore-v1.md
  implementazione:
  - src/persistence/store_backup.cpp
  - src/persistence/store_verify.cpp
  - src/persistence/store_repair.cpp
  prove:
  - scripts/exercise_ops_runbooks.sh
  - tests/unit
  piattaforme:
  - linux-x86_64
  - macos-arm64
  claim_massimo: architectural-prototype
  evidenze:
  - workflow: ops-runbooks.yml
  rischio_residuo:
  - Released-tag artifact consumption remains open; synthetic incompatible restore
    matrices (future Manifest/Record versions, truncated Manifest, Worker mismatch) are
    covered in store_backup_tests
  - Zero-fence hot backup deferred (ADR 0034); online path remains admission-fenced
  - Daemon wire BACKUP process-kill via real glyphastored exec covered by
    glyphastore_crash_backup_daemon (lab-only GLYPHASTORE_CRASH_TEST hooks); in-process
    Server/wire by glyphastore_crash_backup_wire; Store path by glyphastore_crash_backup
  hazards:
  - HAZ-021
  - HAZ-022
  gates:
  - GATE-BACKUP-RESTORE
- id: GS-OPS-MIGRATE-001
  titolo: Offline Worker migrate resume and fail-closed checkpoints
  categoria: operations
  criticita: alta
  stato: implementato
  descrizione: Offline migrate_durable_store / glyphastore_migrate_store copies live keys into a new
    Store with target Worker count, checkpoints after each put, and resumes from a matching sibling
    checkpoint. Corrupt or mismatched checkpoints fail closed; source is never mutated. Live/hot
    migrate remains unsupported (ADR 0024).
  autorita:
  - docs/adr/0024-offline-worker-migration.md
  - docs/architecture/store-migration.md
  - docs/operations/worker-resharding.md
  implementazione:
  - src/persistence/store_migrate.cpp
  - tools/migrate_store.cpp
  prove:
  - tests/unit/store_migrate_tests.cpp
  piattaforme:
  - linux-x86_64
  - macos-arm64
  claim_massimo: architectural-prototype
  evidenze:
  - workflow: ops-runbooks.yml
  rischio_residuo:
  - Process-kill mid-migrate daemon/tool harness still limited relative to filesystem-hook interrupt
  hazards:
  - HAZ-022
  gates:
  - GATE-BACKUP-RESTORE
- id: GS-OPS-SOAK-001
  titolo: Soak and overload paths linked to quality gates
  categoria: operations
  criticita: media
  stato: implementato
  descrizione: Software soak profiles (smoke/long/1h/4h) and graceful-drain/overload runbooks are
    linked to GATE-SOAK and GATE-OPS-RUNBOOKS via engineering/performance/budgets.yaml. Hardware
    multi-hour soak with mandatory rotation evidence remains residual.
  autorita:
  - docs/operations/soak.md
  - docs/operations/graceful-drain-and-overload.md
  - docs/assurance/performance-budgets.md
  - engineering/performance/budgets.yaml
  implementazione:
  - scripts/soak_daemon.sh
  - scripts/exercise_ops_runbooks.sh
  - engineering/performance/budgets.yaml
  prove:
  - scripts/soak_daemon.sh
  - scripts/exercise_ops_runbooks.sh
  - engineering/tools/validate_perf_budgets.py
  piattaforme:
  - linux-x86_64
  - macos-arm64
  claim_massimo: architectural-prototype
  evidenze:
  - workflow: ops-runbooks.yml
  - workflow: soak-extended.yml
  - workflow: assurance.yml
  rischio_residuo:
  - Controlled multi-hour hardware soak with mandatory rotation evidence remains open
  hazards:
  - HAZ-025
  gates:
  - GATE-SOAK
  - GATE-OPS-RUNBOOKS
