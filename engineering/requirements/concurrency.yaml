requirements:
- id: GS-CONCUR-PAIR-001
  titolo: Paired Reader-Writer shard model
  categoria: concurrency
  criticita: critica
  stato: implementato
  descrizione: Official daemon and paired Store runtime use one ShardPair (Reader + sole mutation
    executor via execution token + bounded lanes) per owner id with immutable ReadGeneration
    adoption. Embedded sync may omit a dedicated Writer thread (ADR 0037); daemon retains a
    dedicated executor. Reactor never Store-mutates. Every Writer path shares a pre-Store
    generation-admission decision; current plus at most 64 retired generations, with explicit
    known-not-committed backpressure at retire, incremental-merge capacity, or paired lane
    slot/byte exhaustion. The immutable base uses an exact 64-byte record plus 5 bytes of lookup
    payload per bucket; a sequence-coherent per-lane census exposes the current generation's
    allocation-payload lower bound without presenting it as total RSS. Large immutable-record
    arrays use guarded geometric mappings with at most one spare per base lineage; the spare-pool
    lock is absent from GET and ordinary Delta publication and process-wide spare bytes are
    observable. Incremental merge debt is advanced proportionally to the bounded post-cut capacity
    consumed by the next publication, with a bounded coalesced-batch floor and explicit debt,
    capacity, and maximum-quantum telemetry; fixed terminal retry bursts are not the normal
    admission mechanism.
  autorita:
  - docs/spec/concurrency-memory-model.md
  - docs/spec/mutation-lifecycle.md
  - docs/adr/paired-reader-writer-shards.md
  - docs/adr/0032-paired-concurrency-embedded-store.md
  - docs/adr/0037-shard-execution-token-flat-combining.md
  implementazione:
  - src/store/paired
  - src/server
  - src/worker
  prove:
  - tests/integration/paired_store_core_tests.cpp
  - tests/integration/paired_store_litmus_tests.cpp
  - tests/integration/concurrency_tests.cpp
  - tests/concurrency/linearizability_tests.cpp
  - tests/unit/shard_combining_executor_tests.cpp
  - tests/unit/pair_read_generation_tests.cpp
  - tests/unit/generation_slot_pool_production_tests.cpp
  - tests/integration/server_reactor_paired_tests.cpp
  - tests/integration/server_reactor_server_tests.cpp
  - tests/integration/server_reactor_durable_lifecycle_tests.cpp
  - tests/integration/server_reactor_durable_wire_tests.cpp
  piattaforme:
  - linux-x86_64
  - macos-arm64
  claim_massimo: architectural-prototype
  evidenze:
  - workflow: ci.yml
  - path: engineering/evidence/paired-generation-admission-local-2026-08-27.md
  - path: benchmarks/results/local-macos-2026-08-27-read-generation-memory/README.md
  - path: engineering/evidence/adr0036-production-slot-local-2026-08-27.md
  rischio_residuo:
  - legacy_mutex remains temporary until 0.2 (GS-CONCUR-LEGACY-001); multi-shard composition relies on
    routing independence; embedded catalog refresh may defer until a combiner turn; ADR 0036
    generation_slot_pool remains opt-in (default Alternative A) — durable-group Writer sites,
    V8 production-flag durability soaks, V11/V12 affine performance, and multi-OS sanitizer soaks
    under the flag remain open
  hazards:
  - HAZ-003
  - HAZ-008
  - HAZ-009
  - HAZ-027
  - HAZ-028
  - HAZ-031
  - HAZ-032
  gates:
