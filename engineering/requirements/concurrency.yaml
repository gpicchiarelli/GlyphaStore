- id: GS-CONCUR-COMBINE-001
  titolo: Shard execution token and flat combining
  categoria: concurrency
  criticita: critica
  stato: implementato
  descrizione: Per-shard IDLE/EXECUTING token grants sole mutate+publish rights. Embedded sync
    callers that win the token combine already-queued work (≤32) with no wait-to-fill; lost-wakeup-safe
    release. Daemon keeps a dedicated executor and opportunistically combines already-queued work
    under explicit record/byte bounds. Durable-group collection is capped by the oldest configured
    pre-Store admission deadline, and sync work is limited to 32 records per dedicated turn with an
    older FIFO continuation, so neither repeated admissions nor one large batch can indefinitely
    postpone already-admitted async work. Close reasons, turn splits, and wait time are observable.
    Incremental merge work is charged against bounded post-cut capacity before Store entry;
    coalesced batches amortize a bounded extra quantum and dedicated idle work runs only after
    completion delivery with token release between quanta.
    ADR 0037 Phase C landed. Daemon mutation windows (≤32 contiguous PUT/ERASE) raise a GET
    visibility barrier on published writer_epoch; GET must not adopt an older generation.
    ACK/RAW and fail-closed polarity unchanged.
  autorita:
  - docs/adr/0037-shard-execution-token-flat-combining.md
  - docs/spec/concurrency-memory-model.md
  - docs/spec/mutation-lifecycle.md
  implementazione:
  - include/glyphastore/store/paired/shard_combining_executor.hpp
  - include/glyphastore/server/mutation_window.hpp
  - src/store/paired/shard_pair_runtime.cpp
  - src/server/reactor_dispatch.cpp
  - src/server/reactor_execute.cpp
  - src/server/reactor_io.cpp
  prove:
  - tests/unit/shard_combining_executor_tests.cpp
  - tests/unit/mutation_window_tests.cpp
  - tests/integration/paired_store_core_tests.cpp
  - tests/integration/paired_store_litmus_tests.cpp
  - tests/integration/server_reactor_paired_tests.cpp
  - tests/integration/server_reactor_server_tests.cpp
  - tests/integration/server_reactor_durable_lifecycle_tests.cpp
  - tests/integration/server_reactor_durable_wire_tests.cpp
  piattaforme:
  - linux-x86_64
  - macos-arm64
  claim_massimo: architectural-prototype
  evidenze:
  - workflow: ci.yml
  - path: benchmarks/results/local-macos-2026-08-26-shard-combining/README.md
  - path: benchmarks/results/local-macos-2026-08-27-writer-deadline-fairness/README.md
  - path: benchmarks/results/local-macos-2026-08-27-merge-debt-scheduler/README.md
  - path: engineering/evidence/wave2-hotpath-local-2026-08-27.md
  rischio_residuo:
  - durable_group/periodic flusher token sharing deferred; daemon windows still one TCP port;
    adversarial multi-hour and cross-platform combiner fairness evidence open; durable_sync
    still publishes one generation per committed mutation under the combiner (multi-op publish
    coalesce deferred; RAW / no wait-to-fill polarity unchanged — Wave 2 litmus covers FIFO ×
    token and put_batch RAW)
  hazards:
  - HAZ-003
  - HAZ-027
  - HAZ-028
  - HAZ-032
  gates:
  - GATE-CONCURRENCY-SPEC
- id: GS-CONCUR-LIN-001
  titolo: Linearizability history checker for paired Store API
  categoria: concurrency
  criticita: critica
  stato: provato
  descrizione: Concurrent histories of GET/PUT/ERASE/TTL/RAW/close/compaction on the paired Store are
    recorded with reproducible seeds and checked for linearizability against a sequential map model;
    failures emit a minimized trace.
  autorita:
  - docs/spec/concurrency-memory-model.md
  - docs/adr/0032-paired-concurrency-embedded-store.md
  implementazione:
  - tests/concurrency/linearizability.hpp
  - tests/concurrency/linearizability_tests.cpp
  prove:
  - tests/concurrency/linearizability_tests.cpp
  piattaforme:
  - linux-x86_64
  - macos-arm64
  claim_massimo: architectural-prototype
  evidenze:
  - workflow: ci.yml
  rischio_residuo:
  - Checker state budget bounds history size; durable I/O schedules and multi-key atomicity are out of
    scope
  hazards:
  - HAZ-003
  - HAZ-028
  gates:
  - GATE-CONCURRENCY-SPEC
- id: GS-CONCUR-FAULT-001
  titolo: Debug-only adverse scheduling fault injection
  categoria: concurrency
  criticita: alta
  stato: implementato
  descrizione: Adverse yield/sleep hooks at enqueue/mutate/publish/adopt/rotate/compact/close are compiled
    only when GLYPHASTORE_FAULT_INJECTION is enabled; production builds keep hooks as no-ops.
  autorita:
  - docs/spec/concurrency-memory-model.md
  implementazione:
  - include/glyphastore/core/fault_injection.hpp
  - src/core/fault_injection.cpp
  - src/store/paired/shard_pair_runtime.cpp
  - src/store/store.cpp
  - src/persistence/runtime_catalog.cpp
  prove:
  - tests/concurrency/linearizability_tests.cpp
  piattaforme:
  - linux-x86_64
  - macos-arm64
  claim_massimo: architectural-prototype
  evidenze:
  - workflow: ci.yml
    note: unix-debug/macos-debug presets enable fault injection
  rischio_residuo:
  - Hooks perturb schedules but do not enumerate all interleavings
  hazards:
  - HAZ-003
  - HAZ-008
  - HAZ-027
  gates:
  - GATE-CONCURRENCY-SPEC
