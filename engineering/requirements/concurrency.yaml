  hazards:
  - HAZ-028
  gates:
  - GATE-CONCURRENCY-SPEC
- id: GS-CONCUR-TLA-001
  titolo: Reduced TLA+ ShardPair model
  categoria: concurrency
  criticita: media
  stato: implementato
  descrizione: A bounded TLA+ model of one shard pair covers publish/adopt and shutdown drain; TLC runs
    best-effort in CI with a wall-clock timeout.
  autorita:
  - docs/adr/0032-paired-concurrency-embedded-store.md
  - engineering/formal/shard_pair/README.md
  implementazione:
  - engineering/formal/shard_pair/ShardPair.tla
  - engineering/formal/shard_pair/ShardPair.cfg
  prove:
  - engineering/formal/shard_pair/run-tlc.sh
  piattaforme:
  - linux-x86_64
  claim_massimo: architectural-prototype
  evidenze:
  - workflow: formal-shard-pair.yml
  rischio_residuo:
  - Model omits durable I/O, compaction leases, and multi-shard composition; TLC job is best-effort
  hazards:
  - HAZ-003
  - HAZ-027
  - HAZ-028
  gates:
  - GATE-CONCURRENCY-SPEC
- id: GS-CONCUR-LIVE-001
  titolo: Progress and liveness bounds on drain close and compact admission
  categoria: concurrency
  criticita: alta
  stato: implementato
  descrizione: Writer drain and admission drain honor an optional close_drain_deadline_ms; compact
    admission uses try_lock and fails with sequence_conflict instead of waiting unbounded.
  autorita:
  - docs/spec/concurrency-memory-model.md
  implementazione:
  - include/glyphastore/store/config.hpp
  - src/store/store.cpp
  - src/store/paired/shard_pair_runtime.cpp
  prove:
  - tests/concurrency/linearizability_tests.cpp
  - tests/integration/paired_store_tests.cpp
  piattaforme:
  - linux-x86_64
  - macos-arm64
  claim_massimo: architectural-prototype
  evidenze:
  - workflow: ci.yml
  rischio_residuo:
  - Default close remains unbounded; deadline path is opt-in; no dedicated deadlock detector
  hazards:
  - HAZ-027
  gates:
  - GATE-CONCURRENCY-SPEC
- id: GS-CONCUR-LEGACY-001
  titolo: legacy_mutex temporary policy feature freeze and equivalence
  categoria: concurrency
  criticita: media
  stato: implementato
  descrizione: legacy_mutex remains a deprecated 0.1.x embedded escape hatch removed in 0.2, with
    feature freeze, daemon paired-only, and public-outcome equivalence to the default paired runtime.
  autorita:
  - docs/architecture/legacy-mutex-policy.md
  - docs/adr/0032-paired-concurrency-embedded-store.md
  - docs/spec/concurrency-memory-model.md
  implementazione:
  - include/glyphastore/store/config.hpp
  - src/store/store.cpp
  prove:
  - tests/integration/runtime_equivalence_tests.cpp
  - tests/integration/concurrency_tests.cpp
  - tests/integration/paired_store_tests.cpp
  piattaforme:
  - linux-x86_64
  - macos-arm64
  claim_massimo: architectural-prototype
  evidenze:
  - workflow: ci.yml
  rischio_residuo:
  - Dual-path maintenance until 0.2 removal; equivalence covers public outcomes not full linearizability
  hazards:
  - HAZ-003
  - HAZ-027
  gates:
  - GATE-CONCURRENCY-SPEC
