requirements:
- id: GS-CONCUR-PAIR-001
  titolo: Paired Reader-Writer shard model
  categoria: concurrency
  criticita: critica
  stato: implementato
  descrizione: Official daemon and paired Store runtime use one ShardPair (Reader + sole mutation
    executor via execution token + bounded lanes) per owner id with immutable ReadGeneration
    adoption. Embedded sync may omit a dedicated Writer thread (ADR 0037); daemon retains a
    dedicated executor. Reactor never Store-mutates. Every Writer path shares a pre-Store
    generation-admission decision; current plus at most 64 retired generations, with explicit
    known-not-committed backpressure at retire or incremental-merge capacity.
  autorita:
  - docs/spec/concurrency-memory-model.md
  - docs/spec/mutation-lifecycle.md
  - docs/adr/paired-reader-writer-shards.md
  - docs/adr/0032-paired-concurrency-embedded-store.md
  - docs/adr/0037-shard-execution-token-flat-combining.md
  implementazione:
  - src/store/paired
  - src/server
  - src/worker
  prove:
  - tests/integration/paired_store_tests.cpp
  - tests/integration/concurrency_tests.cpp
  - tests/concurrency/linearizability_tests.cpp
  - tests/unit/shard_combining_executor_tests.cpp
  piattaforme:
  - linux-x86_64
  - macos-arm64
  claim_massimo: architectural-prototype
  evidenze:
  - workflow: ci.yml
  - path: engineering/evidence/paired-generation-admission-local-2026-08-27.md
  rischio_residuo:
  - legacy_mutex remains temporary until 0.2 (GS-CONCUR-LEGACY-001); multi-shard composition relies on
    routing independence; embedded catalog refresh may defer until a combiner turn
  hazards:
  - HAZ-003
  - HAZ-008
  - HAZ-009
  - HAZ-027
  - HAZ-028
  gates:
  - GATE-CONCURRENCY-SPEC
- id: GS-CONCUR-COMBINE-001
  titolo: Shard execution token and flat combining
  categoria: concurrency
  criticita: critica
  stato: implementato
  descrizione: Per-shard IDLE/EXECUTING token grants sole mutate+publish rights. Embedded sync
    callers that win the token combine already-queued work (≤32) with no wait-to-fill; lost-wakeup-safe
    release. Daemon keeps dedicated executor; mutation windows / GET visibility barrier land under
    ADR 0037 Phase C. ACK/RAW and fail-closed polarity unchanged.
  autorita:
  - docs/adr/0037-shard-execution-token-flat-combining.md
  - docs/spec/concurrency-memory-model.md
  - docs/spec/mutation-lifecycle.md
  implementazione:
  - include/glyphastore/store/paired/shard_combining_executor.hpp
  - src/store/paired/shard_pair_runtime.cpp
  - src/server/reactor_dispatch.cpp
  prove:
  - tests/unit/shard_combining_executor_tests.cpp
  - tests/integration/paired_store_tests.cpp
  - tests/integration/server_reactor_durable_tests.cpp
  piattaforme:
  - linux-x86_64
  - macos-arm64
  claim_massimo: architectural-prototype
  evidenze:
  - workflow: ci.yml
  - path: benchmarks/results/local-macos-2026-08-26-shard-combining/README.md
  rischio_residuo:
  - durable_group/periodic flusher token sharing deferred; daemon windows still one TCP port
  hazards:
  - HAZ-003
  - HAZ-027
  - HAZ-028
  gates:
  - GATE-CONCURRENCY-SPEC
- id: GS-CONCUR-LIN-001
  titolo: Linearizability history checker for paired Store API
  categoria: concurrency
  criticita: critica
  stato: provato
  descrizione: Concurrent histories of GET/PUT/ERASE/TTL/RAW/close/compaction on the paired Store are
    recorded with reproducible seeds and checked for linearizability against a sequential map model;
    failures emit a minimized trace.
  autorita:
  - docs/spec/concurrency-memory-model.md
  - docs/adr/0032-paired-concurrency-embedded-store.md
  implementazione:
  - tests/concurrency/linearizability.hpp
  - tests/concurrency/linearizability_tests.cpp
  prove:
  - tests/concurrency/linearizability_tests.cpp
  piattaforme:
  - linux-x86_64
  - macos-arm64
  claim_massimo: architectural-prototype
  evidenze:
  - workflow: ci.yml
  rischio_residuo:
  - Checker state budget bounds history size; durable I/O schedules and multi-key atomicity are out of
    scope
  hazards:
  - HAZ-003
  - HAZ-028
  gates:
  - GATE-CONCURRENCY-SPEC
- id: GS-CONCUR-FAULT-001
  titolo: Debug-only adverse scheduling fault injection
  categoria: concurrency
  criticita: alta
  stato: implementato
  descrizione: Adverse yield/sleep hooks at enqueue/mutate/publish/adopt/rotate/compact/close are compiled
    only when GLYPHASTORE_FAULT_INJECTION is enabled; production builds keep hooks as no-ops.
  autorita:
  - docs/spec/concurrency-memory-model.md
  implementazione:
  - include/glyphastore/core/fault_injection.hpp
  - src/core/fault_injection.cpp
  - src/store/paired/shard_pair_runtime.cpp
  - src/store/store.cpp
  - src/persistence/runtime_catalog.cpp
  prove:
  - tests/concurrency/linearizability_tests.cpp
  piattaforme:
  - linux-x86_64
  - macos-arm64
  claim_massimo: architectural-prototype
  evidenze:
  - workflow: ci.yml
    note: unix-debug/macos-debug presets enable fault injection
  rischio_residuo:
  - Hooks perturb schedules but do not enumerate all interleavings
  hazards:
  - HAZ-003
  - HAZ-008
  - HAZ-027
  gates:
  - GATE-CONCURRENCY-SPEC
- id: GS-CONCUR-MEM-001
  titolo: Atomics memory-order inventory
  categoria: concurrency
  criticita: alta
  stato: implementato
  descrizione: Shared atomics with correctness roles are inventoried with writer/reader, memory order,
    happens-before intent, and proof pointers.
  autorita:
  - docs/spec/concurrency-memory-model.md
  - docs/assurance/memory-order-inventory.md
  implementazione:
  - src/store/paired
  - src/store/store.cpp
  - include/glyphastore/server/bounded_mpsc_queue.hpp
  prove:
  - docs/assurance/memory-order-inventory.md
  piattaforme:
  - linux-x86_64
  - macos-arm64
  claim_massimo: architectural-prototype
  evidenze:
  - path: docs/assurance/memory-order-inventory.md
  rischio_residuo:
