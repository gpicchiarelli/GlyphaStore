requirements:
- id: GS-SEC-PROFILE-001
  titolo: Secure profile TLS mTLS authz and abuse controls
  categoria: security
  criticita: alta
  stato: provato
  descrizione: Optional secure profile provides TLS 1.3, mTLS principals, capability/prefix authorization,
    rate limits, audit events, and local CRL fail-closed as specified.
  autorita:
  - docs/security/secure-profile.md
  - docs/security/threat-model.md
  - docs/adr/0020-tls-outer-transport.md
  - docs/adr/0022-authorization-capabilities.md
  implementazione:
  - src/server/tls.cpp
  - src/server
  prove:
  - scripts/test-secure-profile-interop.sh
  - scripts/test-secure-profile-installed-artifacts.sh
  - engineering/evidence/sdk-installed-secure-profile.md
  piattaforme:
  - linux-x86_64
  - macos-arm64
  - openbsd
  claim_massimo: secure-profile-lab
  evidenze:
  - workflow: ci.yml
  - workflow: openbsd-libressl.yml
  rischio_residuo:
  - >-
    Hostile public bind still wants operator CRL; multi-tenant Phase 8 remainder
    unsupported/deferred (ADR 0028, at-rest crypto); restart-only TLS certs;
    OpenMetrics/Prometheus intentional non-support; physical E3 honesty open
  hazards:
  - HAZ-023
  - HAZ-024
  gates:
  - GATE-AUTH-TRANSPORT
- id: GS-SUPPLY-ACTIONS-001
  titolo: GitHub Actions pinned to immutable commit SHAs
  categoria: security
  criticita: media
  stato: implementato
  descrizione: Every third-party `uses:` in `.github/workflows/*.yml` pins a 40-character commit
    SHA (tag comment optional). Mutable tags/branches are rejected by CI.
  autorita:
  - docs/security/actions-pinning.md
  - docs/security/threat-model.md
  implementazione:
  - .github/workflows
  - engineering/tools/validate_actions_pins.py
  prove:
  - engineering/tools/validate_actions_pins.py
  - .github/workflows/actionlint.yml
  piattaforme:
  - linux-x86_64
  claim_massimo: architectural-prototype
  evidenze:
  - workflow: assurance.yml
  - workflow: actionlint.yml
  rischio_residuo:
  - Dependabot must rewrite floating tags to 40-character commit SHAs before merge
  - A skipped, cancelled, queued, or unavailable hosted workflow is not evidence for the candidate
  gates:
  - GATE-THREAT-SUPPLY
