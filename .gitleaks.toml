# Gitleaks config for GlyphaStore.
# After a single-commit history rewrite, push scans see the whole tree as new
# additions; allow only documented public constants / phrasing false positives.
title = "GlyphaStore"

[extend]
useDefault = true

[allowlist]
description = "Public SipHash/SHA-256 IV material and non-secret documentation phrasing"
regexes = [
  # SHA-256 IV word used as SipHash key1 XOR (ADR 0030); not a credential.
  '''0x6a09e667f3bcc909''',
]
commits = [
  # Documentation-only generic-api-key false positives for the phrase at
  # docs/architecture/durable-runtime-catalog.md:164; no credential exists.
  '''4e96dadca50fd26f42757998c1bd218a6ae56fff''',
  '''c2b43205f9e64c286b59ca210c72d3b16e22347d''',
]
paths = [
  '''(^|/)LICENSES/''',
  '''(^|/)THIRD_PARTY_NOTICES\.md$''',
]
