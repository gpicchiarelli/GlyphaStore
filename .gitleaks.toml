# Gitleaks config for GlyphaStore.
# After a single-commit history rewrite, push scans see the whole tree as new
# additions; allow only documented public constants / phrasing false positives.
title = "GlyphaStore"

[extend]
useDefault = true

[allowlist]
description = "Public SipHash/SHA-256 IV material and non-secret documentation phrasing"
regexes = [
  # SHA-256 IV word used as SipHash key1 XOR (ADR 0030); not a credential.
  '''0x6a09e667f3bcc909''',
]
paths = [
  '''(^|/)LICENSES/''',
  '''(^|/)THIRD_PARTY_NOTICES\.md$''',
]
