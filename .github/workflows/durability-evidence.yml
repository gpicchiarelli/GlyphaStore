name: Durability evidence

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      e2_suite:
        description: E2 collector suite (metadata or process-kill)
        required: false
        default: "metadata"
        type: choice
        options:
          - metadata
          - process-kill
      e3_profile:
        description: E3 block-reset harness profile
        required: false
        default: "smoke"
        type: choice
        options:
          - smoke
          - campaign
      e3_repeat:
        description: E3 per-checkpoint repetitions (harness / orchestrator)
        required: false
        default: "1"
      run_campaign_orchestrator:
        description: Also run E0→E3 campaign orchestrator rehearsal
        required: false
        default: false
        type: boolean
  schedule:
    # Weekly rehearsal; still not E3/E4 certification.
    - cron: "41 5 * * 1"

permissions:
  contents: read

concurrency:
  group: durability-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  e2-collector:
    name: E2 durability collector
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install build tools
        run: |
          python -m pip install --disable-pip-version-check cmake ninja
          sudo apt-get update
          sudo apt-get install -y clang
      - name: Configure and build crash harnesses
        env:
          CC: clang
          CXX: clang++
        run: |
          cmake --preset unix-debug
          cmake --build --preset unix-debug --target \
            glyphastore_crash_persistence \
            glyphastore_crash_daemon \
            glyphastored
      - name: Resolve E2 suite
        id: e2
        run: |
          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            echo "suite=process-kill" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "suite=${{ inputs.e2_suite }}" >> "$GITHUB_OUTPUT"
          else
            echo "suite=metadata" >> "$GITHUB_OUTPUT"
          fi
      - name: Collect E2 evidence artifact
        run: |
          out="durability-evidence/e2-${{ github.run_id }}"
          if [[ "${{ steps.e2.outputs.suite }}" == "process-kill" ]]; then
            ./scripts/collect-durability-evidence.sh \
              --output "$out" \
              --build-dir build/unix-debug \
              --probe-path "$PWD" \
              --run process-kill \
              --repeat 1
          else
            ./scripts/collect-durability-evidence.sh \
              --output "$out" \
              --probe-path "$PWD" \
              --metadata-only
          fi
          # Hosted runners are not a pinned storage row; keep the summary honest.
          grep -q 'Physical power loss exercised: `no`' "$out/summary.md"
          grep -q 'Release-certification eligible: `no`' "$out/summary.md"
      - name: Upload E2 artifact
        uses: actions/upload-artifact@v7
        with:
          name: durability-e2-${{ github.run_id }}
          path: durability-evidence/e2-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 30

  e3-linux-ext4-smoke:
    name: E3 harness (linux-ext4 loopback)
    runs-on: ubuntu-latest
    needs: e2-collector
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install build and block-device tools
        run: |
          python -m pip install --disable-pip-version-check cmake ninja
          sudo apt-get update
          sudo apt-get install -y clang e2fsprogs lvm2
      - name: Configure and build crash persistence
        env:
          CC: clang
          CXX: clang++
        run: |
          cmake --preset unix-debug
          cmake --build --preset unix-debug --target glyphastore_crash_persistence
      - name: Resolve E3 profile and repeats
        id: e3
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "profile=${{ inputs.e3_profile }}" >> "$GITHUB_OUTPUT"
            echo "repeat=${{ inputs.e3_repeat }}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event_name }}" == "schedule" ]]; then
            # Weekly: campaign checkpoint set, modest reps — still e3_certified=no.
            echo "profile=campaign" >> "$GITHUB_OUTPUT"
            echo "repeat=3" >> "$GITHUB_OUTPUT"
          else
            echo "profile=smoke" >> "$GITHUB_OUTPUT"
            echo "repeat=1" >> "$GITHUB_OUTPUT"
          fi
      - name: Run linux-ext4 block-reset harness
        run: |
          out="durability-evidence/e3-linux-ext4-${{ github.run_id }}"
          ./scripts/run-e3-block-reset.sh \
            --output "$out" \
            --build-dir build/unix-debug \
            --platform linux-ext4 \
            --profile "${{ steps.e3.outputs.profile }}" \
            --reset-mechanism auto \
            --repeat "${{ steps.e3.outputs.repeat }}"
          ./scripts/assert-e3-rehearsal-honesty.sh --dir "$out" --kind harness
      - name: Upload E3 harness artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: durability-e3-linux-ext4-${{ github.run_id }}
          path: durability-evidence/e3-linux-ext4-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 30

  e3-macos-apfs-smoke:
    name: E3 harness (macos-apfs diskimage)
    runs-on: macos-latest
    # Keep macOS smoke on schedule/dispatch so PR CI stays lean; Linux loopback covers PR rehearsal.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install build tools
        run: python -m pip install --disable-pip-version-check cmake ninja
      - name: Configure and build crash persistence
        env:
          CC: clang
          CXX: clang++
        run: |
          cmake --preset unix-debug
          cmake --build --preset unix-debug --target glyphastore_crash_persistence
      - name: Resolve macOS E3 profile
        id: e3
        run: |
          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            echo "profile=campaign" >> "$GITHUB_OUTPUT"
            echo "repeat=2" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "profile=${{ inputs.e3_profile }}" >> "$GITHUB_OUTPUT"
            echo "repeat=${{ inputs.e3_repeat }}" >> "$GITHUB_OUTPUT"
          else
            echo "profile=smoke" >> "$GITHUB_OUTPUT"
            echo "repeat=1" >> "$GITHUB_OUTPUT"
          fi
      - name: Run macos-apfs block-reset harness
        run: |
          out="durability-evidence/e3-macos-apfs-${{ github.run_id }}"
          ./scripts/run-e3-block-reset.sh \
            --output "$out" \
            --build-dir build/unix-debug \
            --platform macos-apfs \
            --profile "${{ steps.e3.outputs.profile }}" \
            --reset-mechanism abrupt-detach \
            --repeat "${{ steps.e3.outputs.repeat }}"
          ./scripts/assert-e3-rehearsal-honesty.sh --dir "$out" --kind harness
      - name: Upload E3 macOS harness artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: durability-e3-macos-apfs-${{ github.run_id }}
          path: durability-evidence/e3-macos-apfs-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 30

  e3-campaign-orchestrator-rehearsal:
    name: E3 campaign orchestrator rehearsal (hosted-ci)
    runs-on: ubuntu-latest
    # Full E0→E3 path is heavier; keep off PR smoke. Weekly + optional dispatch.
    if: >
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.run_campaign_orchestrator)
    needs: e2-collector
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install build and block-device tools
        run: |
          python -m pip install --disable-pip-version-check cmake ninja
          sudo apt-get update
          sudo apt-get install -y clang e2fsprogs lvm2
      - name: Configure and build campaign targets
        env:
          CC: clang
          CXX: clang++
        run: |
          cmake --preset unix-debug
          cmake --build --preset unix-debug --target \
            glyphastore_tests \
            glyphastore_allocation_fault_tests \
            glyphastore_crash_persistence \
            glyphastore_crash_daemon \
            glyphastored
      - name: Resolve orchestrator rehearsal knobs
        id: orch
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "e3_profile=${{ inputs.e3_profile }}" >> "$GITHUB_OUTPUT"
            echo "e3_repeat=${{ inputs.e3_repeat }}" >> "$GITHUB_OUTPUT"
          else
            # Weekly: smoke checkpoints through the orchestrator path (not promotion).
            echo "e3_profile=smoke" >> "$GITHUB_OUTPUT"
            echo "e3_repeat=1" >> "$GITHUB_OUTPUT"
          fi
      - name: Run E0→E3 campaign orchestrator (rehearsal pin)
        run: |
          out="durability-evidence/e3-campaign-${{ github.run_id }}"
          ./scripts/run-e3-campaign.sh \
            --output "$out" \
            --build-dir build/unix-debug \
            --pin-label "gha-ubuntu-linux-ext4-${{ github.run_id }}" \
            --hardware-class hosted-ci \
            --fs-pin ext4 \
            --guest-host-boundary loopback-image-on-hosted-ci \
            --platform linux-ext4 \
            --reset-mechanism auto \
            --e3-profile "${{ steps.orch.outputs.e3_profile }}" \
            --repeat "${{ steps.orch.outputs.e3_repeat }}" \
            --e2-repeat 1 \
            --probe-path "$PWD"
          ./scripts/assert-e3-rehearsal-honesty.sh --dir "$out" --kind campaign
          grep -q 'hardware_class=hosted-ci' "$out/campaign-provenance.txt"
          grep -q 'promotion_candidate=no' "$out/campaign-provenance.txt"
      - name: Upload campaign orchestrator artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: durability-e3-campaign-${{ github.run_id }}
          path: |
            durability-evidence/e3-campaign-${{ github.run_id }}
            durability-evidence/e3-campaign-${{ github.run_id }}.tar.gz
            durability-evidence/e3-campaign-${{ github.run_id }}.tar.gz.sha256
          if-no-files-found: ignore
          retention-days: 30
