name: PGO Smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 0"

permissions:
  contents: read

concurrency:
  group: pgo-smoke
  cancel-in-progress: true

jobs:
  pgo-smoke:
    name: PGO generate/train/use smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"

      - name: Install build tools
        run: |
          python -m pip install --disable-pip-version-check cmake ninja
          sudo apt-get update
          sudo apt-get install -y llvm

      - name: Configure PGO instrumentation build
        env:
          CC: clang
          CXX: clang++
        run: cmake --preset unix-pgo-generate

      - name: Build PGO training targets
        run: >-
          cmake --build --preset unix-pgo-generate --target
          glyphastore_benchmarks glyphastore_pgo_durable

      - name: Train profile
        env:
          PGO_PRESET: unix-pgo-generate
        run: ./scripts/pgo-train.sh

      - name: Configure PGO optimized build
        env:
          CC: clang
          CXX: clang++
        run: cmake --preset unix-pgo-use

      - name: Build optimized benchmarks
        run: cmake --build --preset unix-pgo-use --target glyphastore_benchmarks

      - name: Run optimized smoke benchmark
        run: ./build/unix-pgo-use/glyphastore_benchmarks --filter store-put-get --ops 50000 --warmup 1 --repeats 3
