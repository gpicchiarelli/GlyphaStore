name: Static analysis

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  clang-tidy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install --disable-pip-version-check cmake ninja
      - name: Install Clang tools
        run: sudo apt-get update && sudo apt-get install -y clang-tidy clang-format
      - name: Configure with clang-tidy
        env:
          CC: clang
          CXX: clang++
        run: cmake --preset unix-clang-tidy
      - name: Build with analysis
        run: cmake --build --preset unix-clang-tidy
      - name: Check formatting
        run: |
          find include src tests benchmarks fuzz -type f \( -name '*.cpp' -o -name '*.hpp' \) -print0 \
            | xargs -0 clang-format --dry-run --Werror
