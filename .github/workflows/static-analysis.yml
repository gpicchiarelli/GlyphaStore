name: Static analysis

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  clang-tidy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
      - run: python -m pip install --disable-pip-version-check cmake ninja clang-format==21.1.8
      - name: Install Clang tools
        run: sudo apt-get update && sudo apt-get install -y clang-tidy
      - name: Configure with clang-tidy
        env:
          CC: clang
          CXX: clang++
        run: cmake --preset unix-clang-tidy
      - name: Build with analysis
        run: cmake --build --preset unix-clang-tidy
      - name: Check formatting
        run: |
          find include src tests benchmarks fuzz -type f \( -name '*.cpp' -o -name '*.hpp' \) -print0 \
            | xargs -0 clang-format --dry-run --Werror
