name: Release

# Attach packaged SDK / supply-chain artifacts to a GitHub Release on version tags.
# Prototype wording only; does not claim production readiness or E3 certification.
on:
  push:
    tags:
      - "v*"
      - "[0-9]*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to package into a GitHub Release (empty = HEAD packaging only)
        required: false
        default: ""

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-github-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.23"
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: "3.3"
      - name: Install Erlang / rebar3
        run: |
          sudo apt-get update
          sudo apt-get install -y erlang rebar3
      - name: Install syft
        run: sudo ./scripts/install-syft.sh
      - name: Lock SDK versions
        run: ./scripts/check-sdk-versions.sh
      - name: Export reproducible build env
        run: |
          {
            echo "GLYPHASTORE_ROOT=${{ github.workspace }}"
            echo "SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)"
            echo "TZ=UTC"
            echo "PYTHONHASHSEED=0"
            echo "PERL_HASH_SEED=0"
            echo "DETERMINISTIC_BUILD=1"
          } >>"$GITHUB_ENV"
      - name: Package SDK clients
        run: |
          ./scripts/package-python-client.sh
          ./scripts/package-perl-client.sh
          ./scripts/package-go-client.sh
          ./scripts/package-ruby-client.sh
          ./scripts/package-erlang-client.sh
      - name: Checksums + SPDX SBOM
        env:
          SYFT_REQUIRED: "1"
          SDK_ARTIFACT_INDEX_REQUIRE_COMPLETE: "1"
        run: ./scripts/checksum-sdk-artifacts.sh
      - name: Install Cosign
        if: startsWith(github.ref, 'refs/tags/')
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Keyless-sign SDK artifacts
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: dist/sdk-artifacts
        run: |
          set -euo pipefail
          while IFS= read -r -d '' f; do
            base="$(basename "$f")"
            case "$base" in
              *.spdx.json|*.cosign.bundle|SHA256SUMS) continue ;;
            esac
            cosign sign-blob --yes --bundle "${base}.cosign.bundle" "$base"
          done < <(find . -maxdepth 1 -type f -print0)
          cosign sign-blob --yes --bundle SHA256SUMS.cosign.bundle SHA256SUMS
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && github.event.inputs.tag != '')
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ github.event.inputs.tag != '' && github.event.inputs.tag || github.ref_name }}
          name: GlyphaStore ${{ github.event.inputs.tag != '' && github.event.inputs.tag || github.ref_name }}
          draft: false
          prerelease: true
          generate_release_notes: true
          body: |
            Architectural-prototype release artifacts for GlyphaStore.

            - SDK packages, `SHA256SUMS`, and SPDX SBOMs are attached.
            - `sdk-release-index.json` maps exact package digests to SDK roles and contracts.
            - Cosign keyless bundles are attached on tag pushes when signing succeeds.
            - This release does **not** claim production readiness, physical E3/E4
              power-loss certification, or absolute performance budgets.
          files: |
            dist/sdk-artifacts/*
      - name: Upload packaging artifact (dispatch without tag)
        if: ${{ !startsWith(github.ref, 'refs/tags/') && (github.event_name != 'workflow_dispatch' || github.event.inputs.tag == '') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-sdk-artifacts-${{ github.sha }}
          path: dist/sdk-artifacts/
          if-no-files-found: error
