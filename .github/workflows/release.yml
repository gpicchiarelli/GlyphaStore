          path: build/release-input-openbsd/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  security-sanitizers:
    name: Security sanitizer / ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ASan + UBSan
            id: asan-ubsan
            preset: unix-asan
            checks: asan ubsan
          - name: TSan
            id: tsan
            preset: unix-tsan
            checks: tsan
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
      - name: Install sanitizer build tools
        run: python -m pip install --disable-pip-version-check cmake ninja
      - name: Build and execute sanitizer suite
        env:
          CC: clang
          CXX: clang++
          SECURITY_PRESET: ${{ matrix.preset }}
          SECURITY_CHECKS: ${{ matrix.checks }}
        run: |
          set -euo pipefail
          mkdir -p build/security-logs
          combined="build/security-logs/security-${{ matrix.id }}.combined.log"
          {
            cmake --preset "$SECURITY_PRESET"
            cmake --build --preset "$SECURITY_PRESET"
            ctest --preset "$SECURITY_PRESET" --output-on-failure
          } 2>&1 | tee "$combined"
          for check in $SECURITY_CHECKS; do
            {
              cat "$combined"
              echo "SECURITY $check PASSED"
            } >"build/security-logs/security-$check.log"
          done
      - name: Retain sanitizer logs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: security-input-${{ github.sha }}-sanitizer-${{ matrix.id }}
          path: build/security-logs/security-*.log
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  security-codeql:
    name: Security CodeQL / ${{ matrix.language }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: c-cpp
            build-mode: manual
          - language: python
            build-mode: none
          - language: go
            build-mode: manual
          - language: actions
            build-mode: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        if: matrix.language == 'go'
        with:
          go-version: "1.23.x"
          cache-dependency-path: sdk/go/go.mod
      - name: Install C++ analysis build tools
        if: matrix.language == 'c-cpp'
        run: python -m pip install --disable-pip-version-check cmake ninja
      - uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - name: Build C++ database
        if: matrix.language == 'c-cpp'
        env:
          CC: clang
          CXX: clang++
        run: |
          cmake --preset unix-debug
          cmake --build --preset unix-debug
      - name: Build Go database
        if: matrix.language == 'go'
        run: cd sdk/go && go build ./...
      - name: Analyze without implicit SARIF upload
        uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          category: /language:${{ matrix.language }}
          output: codeql-results-${{ matrix.language }}
          upload: never
          upload-database: false
      - name: Validate and retain CodeQL result
        env:
          CODEQL_LANGUAGE: ${{ matrix.language }}
        run: |
          set -euo pipefail
          mkdir -p build/security-logs
          mapfile -t reports < <(find "codeql-results-$CODEQL_LANGUAGE" \
            -type f -name '*.sarif' -size +0c -print | sort)
          test "${#reports[@]}" -ge 1
          python - "${reports[@]}" <<'PY' \
            | tee "build/security-logs/security-codeql-$CODEQL_LANGUAGE.log"
          import json
          import sys
          total = 0
          for path in sys.argv[1:]:
              value = json.load(open(path, encoding="utf-8"))
              runs = value.get("runs")
              if not isinstance(runs, list) or not runs:
                  raise SystemExit(f"invalid SARIF runs: {path}")
              total += sum(len(run.get("results", [])) for run in runs if isinstance(run, dict))
          print(f"validated_sarif={len(sys.argv) - 1} findings={total}")
          PY
          echo "SECURITY codeql-$CODEQL_LANGUAGE PASSED" \
            >>"build/security-logs/security-codeql-$CODEQL_LANGUAGE.log"
      - name: Retain CodeQL SARIF and validation log
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: security-input-${{ github.sha }}-codeql-${{ matrix.language }}
          path: |
            codeql-results-${{ matrix.language }}/*.sarif
            build/security-logs/security-codeql-${{ matrix.language }}.log
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  security-static:
    name: Security static analysis and strict build
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
      - name: Install static-analysis tools
        run: |
          python -m pip install --disable-pip-version-check cmake ninja clang-format==21.1.8
          sudo apt-get update
          sudo apt-get install -y binutils clang-tidy
      - name: Run clang-tidy and formatting gates
        env:
          CC: clang
          CXX: clang++
        run: |
          set -euo pipefail
          mkdir -p build/security-logs
          {
            cmake --preset unix-clang-tidy
            cmake --build --preset unix-clang-tidy
            find include src tests benchmarks fuzz -type f \
              \( -name '*.cpp' -o -name '*.hpp' \) -print0 \
              | xargs -0 clang-format --dry-run --Werror
            echo 'SECURITY static-analysis PASSED'
          } 2>&1 | tee build/security-logs/security-static-analysis.log
      - name: Prove warnings-as-errors and emitted hardening flags
        env:
          CC: clang
          CXX: clang++
        run: |
          set -euo pipefail
          {
            cmake --preset unix-strict
            cmake --build --preset unix-strict
            python scripts/verify_hardening.py build/unix-strict
            ctest --preset unix-strict --output-on-failure
            echo 'SECURITY warnings-as-errors PASSED'
          } 2>&1 | tee build/security-logs/security-warnings-as-errors.log
      - name: Retain static and strict logs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: security-input-${{ github.sha }}-static
          path: build/security-logs/security-*.log
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  security-supply-chain:
    name: Security dependencies secrets and licenses
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.23.x"
          cache-dependency-path: sdk/go/go.mod
      - name: Prepare retained supply-chain logs
        run: mkdir -p build/security-logs
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Record successful secret scan
        run: echo 'SECURITY secret-scan PASSED' >build/security-logs/security-secret-scan.log
      - name: Run blocking Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
          format: sarif
          output: build/security-logs/trivy-fs.sarif
      - name: Validate dependency scan report
        run: |
          set -euo pipefail
          test -s build/security-logs/trivy-fs.sarif
          python - <<'PY' | tee build/security-logs/security-dependency-scan.log
          import json
          value = json.load(open("build/security-logs/trivy-fs.sarif", encoding="utf-8"))
          runs = value.get("runs")
          if not isinstance(runs, list) or not runs:
              raise SystemExit("Trivy SARIF has no runs")
          findings = sum(len(run.get("results", [])) for run in runs if isinstance(run, dict))
          print(f"trivy_sarif_runs={len(runs)} findings={findings}")
          print("SECURITY dependency-scan PASSED")
          PY
      - name: Validate licensing and notice closure
        run: |
          set -euo pipefail
          ./scripts/ci-license-check.sh 2>&1 \
            | tee build/security-logs/security-license-validation.log
          echo 'SECURITY license-validation PASSED' \
            >>build/security-logs/security-license-validation.log
      - name: Retain supply-chain logs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: security-input-${{ github.sha }}-supply-chain
          path: build/security-logs/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  security-matrix-evidence:
    name: Bind complete security matrix to candidate
    needs: [candidate, security-sanitizers, security-codeql, security-static, security-supply-chain]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
      - name: Install exact-binary inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ${{ needs.candidate.outputs.artifact-name }}
          path: dist/release-candidate
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: security-input-${{ github.sha }}-*
          path: build/security-inputs
          merge-multiple: false
      - name: Verify candidate SBOMs and exact distributed ELF hardening
        run: |
          set -euo pipefail
          output=build/release-input-security
          mkdir -p "$output" build/security-candidate-prefix
          echo "${{ needs.candidate.outputs.candidate-seal-sha256 }}  dist/release-candidate/candidate-seal.json" | sha256sum -c -
          python engineering/tools/release_bundle.py verify-seal \
            --directory dist/release-candidate --seal candidate-seal.json
          python engineering/tools/release_bundle.py validate-sbom \
            dist/release-candidate/*.spdx.json \
            2>&1 | tee "$output/security-sbom-validation.log"
          echo 'SECURITY sbom-validation PASSED' >>"$output/security-sbom-validation.log"
          archive="$(find dist/release-candidate -maxdepth 1 -type f \
            -name 'glyphastore-*-linux-*.tar.xz' \
            ! -name 'glyphastore-abi-v*-consumer-*' \
            ! -name 'glyphastore-wire-v*-client-*' -print -quit)"
          test -n "$archive"
          tar -xJf "$archive" -C build/security-candidate-prefix --strip-components=1
          python scripts/verify_hardening.py \
            --binary build/security-candidate-prefix/bin/glyphastored \
            2>&1 | tee "$output/security-binary-hardening.log"
          echo 'SECURITY binary-hardening PASSED' >>"$output/security-binary-hardening.log"
      - name: Close and validate every retained security log
        run: |
          set -euo pipefail
          output=build/release-input-security
          collect_one() {
            local name="$1"
            mapfile -t matches < <(find build/security-inputs -type f \
              -name "security-$name.log" -print | sort)
            test "${#matches[@]}" -eq 1
            cp "${matches[0]}" "$output/security-$name.log"
            grep -Fq "SECURITY $name PASSED" "$output/security-$name.log"
          }
          for check in asan ubsan tsan static-analysis warnings-as-errors \
            dependency-scan secret-scan license-validation; do
            collect_one "$check"
          done
          mapfile -t codeql_logs < <(find build/security-inputs -type f \
            -name 'security-codeql-*.log' -print | sort)
          test "${#codeql_logs[@]}" -eq 4
          cat "${codeql_logs[@]}" >"$output/security-codeql.log"
          for language in actions c-cpp go python; do
            grep -Fq "SECURITY codeql-$language PASSED" "$output/security-codeql.log"
          done
          echo 'SECURITY codeql PASSED' >>"$output/security-codeql.log"
      - name: Bind security evidence to the candidate seal
        run: |
          cat >build/security-matrix-checks.json <<'JSON'
          [
            {"id":"asan","command":"configure, build and execute the complete unix-asan CTest suite with AddressSanitizer enabled","evidence_ref":"security-asan.log"},
            {"id":"ubsan","command":"configure, build and execute the complete unix-asan CTest suite with UndefinedBehaviorSanitizer enabled","evidence_ref":"security-ubsan.log"},
            {"id":"tsan","command":"configure, build and execute the complete unix-tsan CTest suite","evidence_ref":"security-tsan.log"},
            {"id":"codeql","command":"produce and validate non-empty SARIF for C/C++, Python, Go and GitHub Actions using pinned CodeQL actions","evidence_ref":"security-codeql.log"},
            {"id":"static-analysis","command":"build the exact tag through clang-tidy and require clang-format dry-run closure","evidence_ref":"security-static-analysis.log"},
            {"id":"warnings-as-errors","command":"build and test unix-strict, then inspect emitted ISO C++23, warning and hardening flags","evidence_ref":"security-warnings-as-errors.log"},
            {"id":"dependency-scan","command":"run blocking Trivy filesystem scan for fixed HIGH/CRITICAL findings and validate retained SARIF","evidence_ref":"security-dependency-scan.log"},
            {"id":"secret-scan","command":"run pinned Gitleaks over full tag history","evidence_ref":"security-secret-scan.log"},
            {"id":"license-validation","command":"run REUSE, notice, SDK license and Go/Python dependency-license closure","evidence_ref":"security-license-validation.log"},
            {"id":"sbom-validation","command":"validate every SPDX document cryptographically against the externally anchored exact candidate","evidence_ref":"security-sbom-validation.log"},
            {"id":"binary-hardening","command":"extract the sealed Linux prefix and inspect the distributed glyphastored ELF for PIE, RELRO, BIND_NOW and stack protector","evidence_ref":"security-binary-hardening.log"}
          ]
          JSON
          python engineering/tools/release_evidence.py create \
            --root . --type security_matrix \
            --subject dist/release-candidate/candidate-seal.json \
            --output build/release-input-security/security-matrix-evidence.json \
            --check-plan build/security-matrix-checks.json \
            --limitation 'Linux release matrix; findings policy follows the blocking configuration of each pinned analyzer and does not replace native BSD hardening evidence' \
            --require-ci
      - name: Upload same-run security evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-input-${{ github.sha }}-security-matrix
          path: build/release-input-security/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  reproducibility-evidence:
    name: Independently rebuild and compare release archives
    needs: candidate
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      CC: clang
      CXX: clang++
      LD: ld
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ${{ needs.candidate.outputs.artifact-name }}
          path: dist/release-candidate
      - name: Verify reference candidate and export identical build environment
        run: |
          set -euo pipefail
          echo "${{ needs.candidate.outputs.candidate-seal-sha256 }}  dist/release-candidate/candidate-seal.json" | sha256sum -c -
          python engineering/tools/release_bundle.py verify-seal \
            --directory dist/release-candidate --seal candidate-seal.json
          echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)" >>"$GITHUB_ENV"
          echo "TZ=UTC" >>"$GITHUB_ENV"
      - name: Build an isolated second release tree
        run: |
          set -euo pipefail
          evidence=build/release-input-reproducibility
          mkdir -p "$evidence" dist/rebuilt-release
          {
            cmake -S . -B build/release-candidate -G Ninja \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_INSTALL_PREFIX="${GITHUB_WORKSPACE}/build/release-prefix" \
              -DBUILD_TESTING=ON \
              -DGLYPHASTORE_BUILD_BENCHMARKS=OFF \
              -DGLYPHASTORE_BUILD_FUZZERS=OFF \
              -DGLYPHASTORE_ENABLE_TLS=OFF \
              -DGLYPHASTORE_FAULT_INJECTION=OFF \
              -DGLYPHASTORE_NATIVE_CPU=OFF \
              -DGLYPHASTORE_WARNINGS_AS_ERRORS=ON
            cmake --build build/release-candidate --parallel 2
            cmake --install build/release-candidate
            cmake -S tests/consumer -B build/release-consumer -G Ninja \
              -DCMAKE_PREFIX_PATH="${GITHUB_WORKSPACE}/build/release-prefix"
            cmake --build build/release-consumer
            echo 'REPRODUCIBILITY independent-rebuild PASSED'
          } 2>&1 | tee "$evidence/reproducibility-independent-rebuild.log"
          grep -Fq 'REPRODUCIBILITY independent-rebuild PASSED' \
            "$evidence/reproducibility-independent-rebuild.log"
      - name: Repackage all deterministic release archives
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          python engineering/tools/release_bundle.py build-metadata \
            --tag "$RELEASE_TAG" \
            --output build/repro-build-metadata.json \
            --cmake-cache build/release-candidate/CMakeCache.txt \
            --target-os linux \
            --target-os-version "$(. /etc/os-release && printf '%s' "$VERSION_ID")" \
            --architecture "$(uname -m)" \
            --tls-backend none \
            --build-option BUILD_TESTING=ON \
            --build-option CMAKE_BUILD_TYPE=Release \
            --build-option GLYPHASTORE_BUILD_BENCHMARKS=OFF \
            --build-option GLYPHASTORE_BUILD_FUZZERS=OFF \
            --build-option GLYPHASTORE_ENABLE_TLS=OFF \
            --build-option GLYPHASTORE_FAULT_INJECTION=OFF \
            --build-option GLYPHASTORE_NATIVE_CPU=OFF \
            --build-option GLYPHASTORE_WARNINGS_AS_ERRORS=ON
          python engineering/tools/release_bundle.py validate-metadata \
            build/repro-build-metadata.json
          python scripts/package-source-release.py \
            --tag "$RELEASE_TAG" --output-directory dist/rebuilt-release
          python scripts/package-install-prefix.py \
            --tag "$RELEASE_TAG" --prefix build/release-prefix \
            --target-os linux --architecture "$(uname -m)" \
            --output-directory dist/rebuilt-release
          python scripts/package-abi-consumer.py \
            --tag "$RELEASE_TAG" \
            --consumer build/release-consumer/glyphastore_abi_consumer_smoke \
            --target-os linux --architecture "$(uname -m)" \
            --output-directory dist/rebuilt-release
          python scripts/package-wire-client.py \
            --tag "$RELEASE_TAG" \
            --client build/release-candidate/glyphastore_interop_client \
            --target-os linux --architecture "$(uname -m)" \
            --output-directory dist/rebuilt-release
      - name: Compare the complete archive set byte for byte
        run: |
          set -euo pipefail
          echo "${{ needs.candidate.outputs.candidate-seal-sha256 }}  dist/release-candidate/candidate-seal.json" | sha256sum -c -
          python engineering/tools/release_bundle.py verify-seal \
            --directory dist/release-candidate --seal candidate-seal.json
          abi_major="$(cut -d. -f1 ABI_VERSION)"
          python engineering/tools/compare_release_rebuild.py \
            --reference dist/release-candidate \
            --rebuilt dist/rebuilt-release \
            --version "$(cat VERSION)" --abi-major "$abi_major" \
            --wire-version 2 --target-os linux --architecture "$(uname -m)" \
            --reference-metadata dist/release-candidate/build-metadata.json \
            --rebuilt-metadata build/repro-build-metadata.json \
            2>&1 | tee build/release-input-reproducibility/reproducibility-artifact-compare.log
          grep -Fq 'REPRODUCIBILITY artifact-compare PASSED' \
            build/release-input-reproducibility/reproducibility-artifact-compare.log
      - name: Bind reproducibility evidence to the candidate seal
        run: |
          cat >build/reproducibility-checks.json <<'JSON'
          [
            {"id":"independent-rebuild","command":"on a distinct runner, configure, compile and install the exact tag with the candidate toolchain and build options, then independently build retained ABI/wire consumers","evidence_ref":"reproducibility-independent-rebuild.log"},
            {"id":"artifact-compare","command":"repackage source, Linux prefix, ABI consumer and wire client, require the exact closed archive set, then compare every size and SHA-256 with the sealed candidate","evidence_ref":"reproducibility-artifact-compare.log"}
          ]
          JSON
          python engineering/tools/release_evidence.py create \
            --root . --type reproducibility \
            --subject dist/release-candidate/candidate-seal.json \
            --output build/release-input-reproducibility/reproducibility-evidence.json \
            --check-plan build/reproducibility-checks.json \
            --limitation 'same ubuntu-latest image family and declared toolchain; this does not claim cross-distribution or cross-compiler reproducibility' \
            --require-ci
      - name: Retain independent rebuild archives for diagnosis
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: reproducibility-rebuild-${{ github.sha }}
          path: dist/rebuilt-release/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Upload same-run reproducibility evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-input-${{ github.sha }}-reproducibility
          path: build/release-input-reproducibility/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  verify:
    name: Verify exact candidate bytes
    needs: [candidate, sdk-installed-evidence, persistent-compatibility-evidence, abi-compatibility-evidence, wire-compatibility-evidence, freebsd-package-evidence, openbsd-package-evidence, security-matrix-evidence, reproducibility-evidence]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ${{ needs.candidate.outputs.artifact-name }}
          path: dist/release-candidate
      - name: Admit the exact candidate before evidence aggregation
        run: |
          echo "${{ needs.candidate.outputs.candidate-seal-sha256 }}  dist/release-candidate/candidate-seal.json" | sha256sum -c -
          python engineering/tools/release_bundle.py admit-candidate \
            --directory dist/release-candidate \
            --candidate-seal candidate-seal.json
          python engineering/tools/release_bundle.py validate-sbom \
            dist/release-candidate/*.spdx.json
      - name: Test installed binary archive without rebuilding GlyphaStore
        run: |
          set -euo pipefail
          archive="$(find dist/release-candidate -maxdepth 1 -type f \
            -name 'glyphastore-*-linux-*.tar.xz' \
            ! -name 'glyphastore-abi-v*-consumer-*' \
            ! -name 'glyphastore-wire-v*-client-*' -print -quit)"
          test -n "$archive"
          mkdir -p build/extracted
          tar -xJf "$archive" -C build/extracted
          prefix="$(find build/extracted -mindepth 1 -maxdepth 1 -type d -print -quit)"
          test -x "$prefix/bin/glyphastored"
          test "$("$prefix/bin/glyphastored" --version)" = \
            "glyphastored $(cat VERSION)"
          cmake -S tests/consumer -B build/verified-consumer -G Ninja \
            -DCMAKE_PREFIX_PATH="$prefix"
          cmake --build build/verified-consumer
          ctest --test-dir build/verified-consumer --output-on-failure
          read -r -a pkg_config_flags <<< "$(
            PKG_CONFIG_PATH="$prefix/lib/pkgconfig" \
              pkg-config --cflags --libs glyphastore-abi
          )"
          cc -std=c11 tests/consumer/abi.c \
            "${pkg_config_flags[@]}" \
            -o build/verified-consumer/pkgconfig-abi-consumer
          LD_LIBRARY_PATH="$prefix/lib" build/verified-consumer/pkgconfig-abi-consumer
      - name: Download same-run certification inputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: release-input-${{ github.sha }}-*
          path: dist/release-inputs
          merge-multiple: false
      - name: Import the closed evidence and native-package set
        run: |
          set -euo pipefail
          mapfile -t sources < <(find dist/release-inputs -mindepth 1 -maxdepth 1 \
            -type d -print | sort)
          if (( ${#sources[@]} == 0 )); then
            echo "no same-run release certification inputs were produced" >&2
            exit 1
          fi
          arguments=()
          for source in "${sources[@]}"; do
            arguments+=(--source-directory "$source")
          done
          python engineering/tools/release_bundle.py import-evidence \
            --directory dist/release-candidate "${arguments[@]}"
          python engineering/tools/release_bundle.py validate-evidence-import \
            --directory dist/release-candidate
      - name: Bind verification, release manifest, and checksums
        run: |
          set -euo pipefail
          python engineering/tools/release_bundle.py verification \
            --directory dist/release-candidate
          python engineering/tools/release_bundle.py manifest \
            --directory dist/release-candidate
          python engineering/tools/release_bundle.py validate-manifest \
            --directory dist/release-candidate
          python engineering/tools/validate_bsd_packaging.py --release
          python engineering/tools/release_evidence.py --require-ci \
            dist/release-candidate/*-evidence.json
          python engineering/tools/release_bundle.py validate-release-policy \
            --directory dist/release-candidate
          python engineering/tools/release_bundle.py checksums \
            --directory dist/release-candidate
          python engineering/tools/release_bundle.py verify-checksums \
            --directory dist/release-candidate
          python engineering/tools/release_bundle.py seal \
            --directory dist/release-candidate \
            --seal verified-seal.json \
            --kind verified
          python engineering/tools/release_bundle.py verify-seal \
            --directory dist/release-candidate \
            --seal verified-seal.json
      - name: Attest the verified transitive seal
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: dist/release-candidate/verified-seal.json
      - name: Retain and verify offline Sigstore bundle
        run: |
          set -euo pipefail
          mkdir -p dist/release-provenance
          cp "${{ steps.attest.outputs.bundle-path }}" \
            dist/release-provenance/verified-seal.sigstore.json
          gh attestation verify dist/release-candidate/verified-seal.json \
            --repo "$GITHUB_REPOSITORY" \
            --bundle dist/release-provenance/verified-seal.sigstore.json \
            --signer-workflow "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/.github/workflows/release.yml" \
            --source-ref "$GITHUB_REF" \
            --source-digest "$GITHUB_SHA"
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: verified-release-${{ github.sha }}
          path: dist/release-candidate/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-provenance-${{ github.sha }}
          path: dist/release-provenance/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  publish:
    name: Publish verified bytes
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: verified-release-${{ github.sha }}
          path: dist/release-candidate
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-provenance-${{ github.sha }}
          path: dist/release-provenance
      - name: Reverify promotion input without rebuilding
        run: |
          set -euo pipefail
          python engineering/tools/release_bundle.py verify-seal \
            --directory dist/release-candidate \
            --seal verified-seal.json
          python engineering/tools/release_bundle.py verify-checksums \
            --directory dist/release-candidate
          python engineering/tools/release_bundle.py validate-manifest \
            --directory dist/release-candidate
          gh attestation verify dist/release-candidate/verified-seal.json \
            --repo "$GITHUB_REPOSITORY" \
            --bundle dist/release-provenance/verified-seal.sigstore.json \
            --signer-workflow "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/.github/workflows/release.yml" \
            --source-ref "$GITHUB_REF" \
            --source-digest "$GITHUB_SHA"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Refuse release asset replacement
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "release $RELEASE_TAG already exists; published assets are immutable" >&2
            exit 1
          fi
      - name: Publish the same verified bytes
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ github.ref_name }}
          name: GlyphaStore ${{ github.ref_name }}
          draft: false
          prerelease: true
          generate_release_notes: true
          body: |
            Architectural-prototype release artifacts for GlyphaStore.

            Candidate bytes were built once, sealed, independently verified,
            attested, and promoted without rebuilding. `release-manifest.json`,
            `SHA256SUMS`, SPDX SBOMs, and the offline Sigstore bundle are attached.

            This prerelease does not claim production readiness, E3/E4 physical
            durability certification, or BSD package proof unless those exact
            platform artifacts and evidence are present in the manifest.
          files: |
            dist/release-candidate/*
            dist/release-provenance/*
