name: Release

# Candidate -> Verify -> Publish. Verify and Publish never rebuild GlyphaStore;
# both consume the exact candidate bytes and re-check their transitive seals.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  candidate:
    name: Candidate / build once
    permissions:
      contents: read
    uses: ./.github/workflows/release-candidate.yml
    with:
      tag: ${{ github.ref_name }}

  sdk-installed-evidence:
    name: Certify installed SDKs against candidate bytes
    needs: candidate
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.23.x"
          cache-dependency-path: sdk/go/go.mod
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: "3.3"
      - name: Install SDK certification toolchains
        run: |
          python -m pip install --disable-pip-version-check cmake ninja
          sudo apt-get update
          sudo apt-get install -y clang erlang lsof pkgconf rebar3
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ${{ needs.candidate.outputs.artifact-name }}
          path: dist/release-candidate
      - name: Verify and extract the exact candidate
        run: |
          set -euo pipefail
          echo "${{ needs.candidate.outputs.candidate-seal-sha256 }}  dist/release-candidate/candidate-seal.json" | sha256sum -c -
          python engineering/tools/release_bundle.py verify-seal \
            --directory dist/release-candidate \
            --seal candidate-seal.json
          archive="$(find dist/release-candidate -maxdepth 1 -type f \
            -name 'glyphastore-*-linux-*.tar.xz' \
            ! -name 'glyphastore-abi-v*-consumer-*' \
            ! -name 'glyphastore-wire-v*-client-*' -print -quit)"
          test -n "$archive"
          mkdir -p build/release-sdk-prefix
          tar -xJf "$archive" -C build/release-sdk-prefix --strip-components=1
          test -x build/release-sdk-prefix/bin/glyphastored
          test -f build/release-sdk-prefix/lib/cmake/GlyphaStore/GlyphaStoreConfig.cmake
      - name: Prove installed C and C++ consumers
        run: |
          set -euo pipefail
          evidence=build/release-input-sdk
          mkdir -p "$evidence"
          {
            cmake -S tests/consumer -B build/release-sdk-consumer -G Ninja \
              -DCMAKE_PREFIX_PATH="${GITHUB_WORKSPACE}/build/release-sdk-prefix"
            cmake --build build/release-sdk-consumer
            ctest --test-dir build/release-sdk-consumer --output-on-failure
            read -r -a pkg_config_flags <<< "$(
              PKG_CONFIG_PATH="${GITHUB_WORKSPACE}/build/release-sdk-prefix/lib/pkgconfig" \
                pkg-config --cflags --libs glyphastore-abi
            )"
            cc -std=c11 tests/consumer/abi.c \
              "${pkg_config_flags[@]}" \
              -o build/release-sdk-consumer/pkgconfig-abi-consumer
            LD_LIBRARY_PATH="${GITHUB_WORKSPACE}/build/release-sdk-prefix/lib" \
              build/release-sdk-consumer/pkgconfig-abi-consumer
          } 2>&1 | tee "$evidence/native-consumers.log"
      - name: Package and exercise every installed SDK
        run: |
          set -euo pipefail
          evidence=build/release-input-sdk
          {
            ./scripts/package-python-client.sh
            ./scripts/package-perl-client.sh
            ./scripts/package-go-client.sh
            ./scripts/package-ruby-client.sh
            ./scripts/package-erlang-client.sh
            INSTALLED_INTEROP_PROFILE=plain \
              GLYPHASTORED="${GITHUB_WORKSPACE}/build/release-sdk-prefix/bin/glyphastored" \
              GLYPHASTORE_CPP_PREFIX="${GITHUB_WORKSPACE}/build/release-sdk-prefix" \
              ./scripts/test-secure-profile-installed-artifacts.sh
          } 2>&1 | tee "$evidence/sdk-installed.log"
          grep -Fqx \
            'Installed C++/Python/Perl/Ruby/Go/Erlang plain interop PASSED' \
            "$evidence/sdk-installed.log"
      - name: Bind installed SDK evidence to the candidate seal
        run: |
          set -euo pipefail
          cat >build/sdk-installed-checks.json <<'JSON'
          [
            {"id":"source-isolation","command":"package all SDKs, install outside checkout, reject source-tree loads, then run plain interop","evidence_ref":"sdk-installed.log"},
            {"id":"c","command":"configure/build/test external C consumer and pkg-config C11 consumer against extracted prefix","evidence_ref":"native-consumers.log"},
            {"id":"cpp","command":"configure/build/test external C++ consumer and installed-package interop peer against extracted prefix","evidence_ref":"sdk-installed.log"},
            {"id":"python","command":"package-python-client.sh then installed plain interop","evidence_ref":"sdk-installed.log"},
            {"id":"perl","command":"package-perl-client.sh then installed plain interop","evidence_ref":"sdk-installed.log"},
            {"id":"go","command":"package-go-client.sh then installed plain interop","evidence_ref":"sdk-installed.log"},
            {"id":"erlang","command":"package-erlang-client.sh then installed plain interop","evidence_ref":"sdk-installed.log"},
            {"id":"ruby","command":"package-ruby-client.sh then installed plain interop","evidence_ref":"sdk-installed.log"}
          ]
          JSON
          python engineering/tools/release_evidence.py create \
            --root . \
            --type sdk_installed_interop \
            --subject dist/release-candidate/candidate-seal.json \
            --output build/release-input-sdk/sdk-installed-interop-evidence.json \
            --check-plan build/sdk-installed-checks.json \
            --limitation 'candidate TLS is disabled; secure-profile installed interop remains a separate CI gate' \
            --require-ci
      - name: Upload same-run installed SDK evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-input-${{ github.sha }}-sdk-installed
          path: build/release-input-sdk/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  persistent-compatibility-evidence:
    name: Certify persistence v1 against prior tagged Store
    needs: candidate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
      - name: Install artifact-only persistence harness dependencies
        run: |
          python -m pip install --disable-pip-version-check cmake ninja
          sudo apt-get update
          sudo apt-get install -y clang lsof
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ${{ needs.candidate.outputs.artifact-name }}
          path: dist/release-candidate
      - name: Verify and extract the exact candidate
        run: |
          set -euo pipefail
          echo "${{ needs.candidate.outputs.candidate-seal-sha256 }}  dist/release-candidate/candidate-seal.json" | sha256sum -c -
          python engineering/tools/release_bundle.py verify-seal \
            --directory dist/release-candidate \
            --seal candidate-seal.json
          archive="$(find dist/release-candidate -maxdepth 1 -type f \
            -name 'glyphastore-*-linux-*.tar.xz' \
            ! -name 'glyphastore-abi-v*-consumer-*' \
            ! -name 'glyphastore-wire-v*-client-*' -print -quit)"
          test -n "$archive"
          mkdir -p build/release-persistence-prefix
          tar -xJf "$archive" -C build/release-persistence-prefix --strip-components=1
          test -x build/release-persistence-prefix/bin/glyphastored
      - name: Select a real prior tagged Store fixture
        run: |
          set -euo pipefail
          python engineering/tools/persistence_fixture.py select \
            --directory tests/fixtures/released-stores \
            --before-version "$(cat VERSION)" \
            --repository . \
            >build/prior-store-fixture.txt
          fixture="$(cat build/prior-store-fixture.txt)"
          python engineering/tools/persistence_fixture.py validate \
            "$fixture" --before-version "$(cat VERSION)" --repository .
      - name: Build the protocol probe only from installed candidate metadata
        run: |
          ./scripts/build-installed-cpp-interop.sh \
            build/release-persistence-prefix \
            build/release-persistence-client
      - name: Exercise old Store open, recovery, migration, backup, and repair
        run: |
          set -euo pipefail
          evidence=build/release-input-persistence
          fixture="$(cat build/prior-store-fixture.txt)"
          mkdir -p "$evidence"
          for check in new-opens-old fixture-recovery migration backup-verify-repair; do
            ./scripts/test-installed-persistence-compat.sh \
              --prefix build/release-persistence-prefix \
              --fixture "$fixture" \
              --client build/release-persistence-client \
              --check "$check" 2>&1 | tee "$evidence/persistent-$check.log"
            grep -Fq "PERSISTENCE-COMPAT $check PASSED" \
              "$evidence/persistent-$check.log"
          done
      - name: Bind persistence evidence to the candidate seal
        run: |
          set -euo pipefail
          cat >build/persistent-compatibility-checks.json <<'JSON'
          [
            {"id":"new-opens-old","command":"candidate verify and daemon open-existing against the newest strictly older tagged Store fixture, then exact probe GET","evidence_ref":"persistent-new-opens-old.log"},
            {"id":"fixture-recovery","command":"two candidate open-existing cycles with intervening offline verification and exact probe GET","evidence_ref":"persistent-fixture-recovery.log"},
            {"id":"migration","command":"candidate offline Worker-count migration into a new Store, verify, reopen, and exact probe GET","evidence_ref":"persistent-migration.log"},
            {"id":"backup-verify-repair","command":"candidate backup, restore, verify, orphan quarantine repair, reopen, and exact probe GET","evidence_ref":"persistent-backup-verify-repair.log"}
          ]
          JSON
          python engineering/tools/release_evidence.py create \
            --root . \
            --type persistent_compatibility \
            --subject dist/release-candidate/candidate-seal.json \
            --output build/release-input-persistence/persistent-compatibility-evidence.json \
            --check-plan build/persistent-compatibility-checks.json \
            --limitation 'requires a permanent tagged Store fixture strictly older than the candidate; no such baseline is inferred from current-tree codec vectors' \
            --require-ci
      - name: Upload same-run persistence evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-input-${{ github.sha }}-persistent-compatibility
          path: build/release-input-persistence/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  abi-compatibility-evidence:
    name: Certify C ABI v1 against prior official release
    needs: candidate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
      - name: Install ABI harness dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils pkgconf
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ${{ needs.candidate.outputs.artifact-name }}
          path: dist/release-candidate
      - name: Verify and extract the exact candidate
        run: |
          set -euo pipefail
          echo "${{ needs.candidate.outputs.candidate-seal-sha256 }}  dist/release-candidate/candidate-seal.json" | sha256sum -c -
          python engineering/tools/release_bundle.py verify-seal \
            --directory dist/release-candidate --seal candidate-seal.json
          archive="$(find dist/release-candidate -maxdepth 1 -type f \
            -name 'glyphastore-*-linux-*.tar.xz' \
            ! -name 'glyphastore-abi-v*-consumer-*' \
            ! -name 'glyphastore-wire-v*-client-*' -print -quit)"
          test -n "$archive"
          mkdir -p build/abi-candidate-prefix
          tar -xJf "$archive" -C build/abi-candidate-prefix --strip-components=1
          test -f build/abi-candidate-prefix/share/GlyphaStore/ABI_VERSION
      - name: Select and download the newest prior ABI-compatible release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          abi_major="$(cut -d. -f1 build/abi-candidate-prefix/share/GlyphaStore/ABI_VERSION)"
          python engineering/tools/prior_release.py select \
            --repository . --before-version "$(cat VERSION)" --abi-major "$abi_major" \
            >build/prior-release-tag.txt
          prior_tag="$(cat build/prior-release-tag.txt)"
          mkdir -p build/prior-release-download build/prior-release build/prior-provenance
          gh release download "$prior_tag" --dir build/prior-release-download
          mapfile -t provenance < <(find build/prior-release-download -maxdepth 1 -type f \
            -name 'verified-seal.sigstore.json' -print)
          test "${#provenance[@]}" -eq 1
          cp "${provenance[0]}" build/prior-provenance/verified-seal.sigstore.json
          find build/prior-release-download -maxdepth 1 -type f \
            ! -name 'verified-seal.sigstore.json' -exec cp {} build/prior-release/ \;
      - name: Verify prior release seal, policy, identity, and attestation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          prior_tag="$(cat build/prior-release-tag.txt)"
          prior_sha="$(git rev-parse "$prior_tag^{commit}")"
          abi_major="$(cut -d. -f1 build/abi-candidate-prefix/share/GlyphaStore/ABI_VERSION)"
          python engineering/tools/prior_release.py validate \
            --directory build/prior-release --repository . --tag "$prior_tag" \
            --before-version "$(cat VERSION)" --abi-major "$abi_major" \
            --architecture "$(uname -m)" --output build/prior-release.json
          gh attestation verify build/prior-release/verified-seal.json \
            --repo "$GITHUB_REPOSITORY" \
            --bundle build/prior-provenance/verified-seal.sigstore.json \
            --signer-workflow "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/.github/workflows/release.yml" \
            --source-ref "refs/tags/$prior_tag" --source-digest "$prior_sha"
      - name: Extract sealed prior prefix and compiled consumer
        run: |
          set -euo pipefail
          read_field() {
            python - "$1" <<'PY'
          import json
          import sys
          print(json.load(open("build/prior-release.json", encoding="utf-8"))[sys.argv[1]])
          PY
          }
          install_archive="$(read_field install_archive)"
          consumer_archive="$(read_field abi_consumer_archive)"
          mkdir -p build/abi-prior-prefix
          tar -xJf "build/prior-release/$install_archive" \
            -C build/abi-prior-prefix --strip-components=1
          python engineering/tools/abi_consumer_fixture.py \
            --archive "build/prior-release/$consumer_archive" \
            --expected-version "$(read_field product_version)" \
            --expected-git-sha "$(read_field git_sha)" \
            --expected-abi-major "$(cut -d. -f1 build/abi-candidate-prefix/share/GlyphaStore/ABI_VERSION)" \
            --extract-to build/prior-abi-consumer
      - name: Exercise exact symbols, layout, and both binary directions
        run: |
          set -euo pipefail
          evidence=build/release-input-abi
          mkdir -p "$evidence" build/abi-check-work
          for check in exact-symbols layout old-consumer-new-library new-consumer-old-library; do
            ./scripts/test-installed-abi-compat.sh \
              --candidate-prefix build/abi-candidate-prefix \
              --prior-prefix build/abi-prior-prefix \
              --prior-consumer build/prior-abi-consumer \
              --work build/abi-check-work --check "$check" \
              2>&1 | tee "$evidence/abi-$check.log"
            grep -Fq "ABI-COMPAT $check PASSED" "$evidence/abi-$check.log"
          done
      - name: Bind ABI evidence to the candidate seal
        run: |
          cat >build/abi-compatibility-checks.json <<'JSON'
          [
            {"id":"exact-symbols","command":"inspect the candidate shared library and require the exact ABI-v1 symbol authority","evidence_ref":"abi-exact-symbols.log"},
            {"id":"layout","command":"compile fixed layout assertions through candidate installed metadata and execute with candidate library","evidence_ref":"abi-layout.log"},
            {"id":"old-consumer-new-library","command":"execute the prior release sealed compiled consumer with the candidate ABI library and prove loader resolution","evidence_ref":"abi-old-consumer-new-library.log"},
            {"id":"new-consumer-old-library","command":"compile the new consumer against candidate headers and execute with the prior official library, proving loader resolution","evidence_ref":"abi-new-consumer-old-library.log"}
          ]
          JSON
          python engineering/tools/release_evidence.py create \
            --root . --type abi_compatibility \
            --subject dist/release-candidate/candidate-seal.json \
            --output build/release-input-abi/abi-compatibility-evidence.json \
            --check-plan build/abi-compatibility-checks.json \
            --limitation 'requires a complete attested prior release with the same ABI major and its sealed compiled consumer fixture' \
            --require-ci
      - name: Upload same-run ABI evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-input-${{ github.sha }}-abi-compatibility
          path: build/release-input-abi/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  wire-compatibility-evidence:
    name: Certify wire v2 against prior official release
    needs: candidate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
      - name: Install wire harness dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y lsof
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ${{ needs.candidate.outputs.artifact-name }}
          path: dist/release-candidate
      - name: Verify and extract the exact candidate server and client
        run: |
          set -euo pipefail
          echo "${{ needs.candidate.outputs.candidate-seal-sha256 }}  dist/release-candidate/candidate-seal.json" | sha256sum -c -
          python engineering/tools/release_bundle.py verify-seal \
            --directory dist/release-candidate --seal candidate-seal.json
          install_archive="$(find dist/release-candidate -maxdepth 1 -type f \
            -name 'glyphastore-*-linux-*.tar.xz' \
            ! -name 'glyphastore-abi-v*-consumer-*' \
            ! -name 'glyphastore-wire-v*-client-*' -print -quit)"
          wire_archive="$(find dist/release-candidate -maxdepth 1 -type f \
            -name 'glyphastore-wire-v2-client-*-linux-*.tar.xz' -print -quit)"
          test -n "$install_archive"
          test -n "$wire_archive"
          mkdir -p build/wire-candidate-prefix
          tar -xJf "$install_archive" -C build/wire-candidate-prefix --strip-components=1
          python engineering/tools/wire_client_fixture.py \
            --archive "$wire_archive" --expected-version "$(cat VERSION)" \
            --expected-git-sha "$(git rev-parse HEAD)" --expected-wire-version 2 \
            --extract-to build/candidate-wire-client
      - name: Select and download the newest prior compatible release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          abi_major="$(cut -d. -f1 build/wire-candidate-prefix/share/GlyphaStore/ABI_VERSION)"
          python engineering/tools/prior_release.py select \
            --repository . --before-version "$(cat VERSION)" --abi-major "$abi_major" \
            >build/prior-wire-release-tag.txt
          prior_tag="$(cat build/prior-wire-release-tag.txt)"
          mkdir -p build/prior-wire-download build/prior-wire-release build/prior-wire-provenance
          gh release download "$prior_tag" --dir build/prior-wire-download
          mapfile -t provenance < <(find build/prior-wire-download -maxdepth 1 -type f \
            -name 'verified-seal.sigstore.json' -print)
          test "${#provenance[@]}" -eq 1
          cp "${provenance[0]}" build/prior-wire-provenance/verified-seal.sigstore.json
          find build/prior-wire-download -maxdepth 1 -type f \
            ! -name 'verified-seal.sigstore.json' -exec cp {} build/prior-wire-release/ \;
      - name: Verify prior release seal, policy, identity, and attestation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          prior_tag="$(cat build/prior-wire-release-tag.txt)"
          prior_sha="$(git rev-parse "$prior_tag^{commit}")"
          abi_major="$(cut -d. -f1 build/wire-candidate-prefix/share/GlyphaStore/ABI_VERSION)"
          python engineering/tools/prior_release.py validate \
            --directory build/prior-wire-release --repository . --tag "$prior_tag" \
            --before-version "$(cat VERSION)" --abi-major "$abi_major" \
            --wire-version 2 --architecture "$(uname -m)" \
            --output build/prior-wire-release.json
          gh attestation verify build/prior-wire-release/verified-seal.json \
            --repo "$GITHUB_REPOSITORY" \
            --bundle build/prior-wire-provenance/verified-seal.sigstore.json \
            --signer-workflow "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/.github/workflows/release.yml" \
            --source-ref "refs/tags/$prior_tag" --source-digest "$prior_sha"
      - name: Extract the sealed prior server and compiled client
        run: |
          set -euo pipefail
          read_field() {
            python - "$1" <<'PY'
          import json
          import sys
          print(json.load(open("build/prior-wire-release.json", encoding="utf-8"))[sys.argv[1]])
          PY
          }
          install_archive="$(read_field install_archive)"
          wire_archive="$(read_field wire_client_archive)"
          mkdir -p build/wire-prior-prefix
          tar -xJf "build/prior-wire-release/$install_archive" \
            -C build/wire-prior-prefix --strip-components=1
          python engineering/tools/wire_client_fixture.py \
            --archive "build/prior-wire-release/$wire_archive" \
            --expected-version "$(read_field product_version)" \
            --expected-git-sha "$(read_field git_sha)" --expected-wire-version 2 \
            --extract-to build/prior-wire-client
      - name: Exercise all wire compatibility directions
        run: |
          set -euo pipefail
          evidence=build/release-input-wire
          mkdir -p "$evidence" build/wire-check-work
          for check in new-client-new-server old-client-new-server new-client-old-server; do
            ./scripts/test-installed-wire-compat.sh \
              --candidate-prefix build/wire-candidate-prefix \
              --prior-prefix build/wire-prior-prefix \
              --candidate-client build/candidate-wire-client \
              --prior-client build/prior-wire-client \
              --work build/wire-check-work --check "$check" \
              2>&1 | tee "$evidence/wire-$check.log"
            grep -Fq "WIRE-COMPAT $check PASSED" "$evidence/wire-$check.log"
          done
      - name: Bind wire evidence to the candidate seal
        run: |
          cat >build/wire-compatibility-checks.json <<'JSON'
          [
            {"id":"new-client-new-server","command":"execute candidate sealed wire-v2 client against candidate installed daemon through PUT/GET/ERASE/not-found","evidence_ref":"wire-new-client-new-server.log"},
            {"id":"old-client-new-server","command":"execute prior release sealed wire-v2 client against candidate installed daemon through PUT/GET/ERASE/not-found","evidence_ref":"wire-old-client-new-server.log"},
            {"id":"new-client-old-server","command":"execute candidate sealed wire-v2 client against prior official installed daemon through PUT/GET/ERASE/not-found","evidence_ref":"wire-new-client-old-server.log"}
          ]
          JSON
          python engineering/tools/release_evidence.py create \
            --root . --type wire_compatibility \
            --subject dist/release-candidate/candidate-seal.json \
            --output build/release-input-wire/wire-compatibility-evidence.json \
            --check-plan build/wire-compatibility-checks.json \
            --limitation 'plain TCP wire-v2 baseline; requires a complete attested prior release with its sealed compiled wire client and does not imply compatibility with any other wire version' \
            --require-ci
      - name: Upload same-run wire evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-input-${{ github.sha }}-wire-compatibility
          path: build/release-input-wire/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  freebsd-package-evidence:
    name: Certify native FreeBSD package lifecycle
    needs: candidate
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ${{ needs.candidate.outputs.artifact-name }}
          path: dist/release-candidate
      - name: Admit native-package prerequisites and exact candidate
        run: |
          set -euo pipefail
          echo "${{ needs.candidate.outputs.candidate-seal-sha256 }}  dist/release-candidate/candidate-seal.json" | sha256sum -c -
          python engineering/tools/release_bundle.py verify-seal \
            --directory dist/release-candidate --seal candidate-seal.json
          python engineering/tools/validate_bsd_packaging.py --release
      - name: Build, install, exercise, restart, and remove package on FreeBSD
        uses: vmactions/freebsd-vm@83b151f58c6047089f4c80eb5ba2039d158ce093 # v1
        env:
          CANDIDATE_SEAL_SHA256: ${{ needs.candidate.outputs.candidate-seal-sha256 }}
        with:
          release: "14.3"
          arch: x86_64
          usesh: true
          copyback: true
          sync: rsync
          mem: 8192
          prepare: |
            pkg install -y bash cmake git ninja openssl pkgconf python3
            test -d /usr/ports/.git || \
              git clone --depth 1 https://git.FreeBSD.org/ports.git /usr/ports
          run: |
            set -e
            chmod +x scripts/test-freebsd-package-lifecycle.sh
            bash scripts/test-freebsd-package-lifecycle.sh \
              dist/release-candidate build/release-input-freebsd
            rm -rf build/unix-release
      - name: Bind SPDX SBOM to native package
        run: |
          set -euo pipefail
          sudo ./scripts/install-syft.sh
          mapfile -t packages < <(find build/release-input-freebsd -maxdepth 1 \
            -type f -name 'glyphastore-*-freebsd*.pkg' -print)
          test "${#packages[@]}" -eq 1
          input=build/freebsd-package.spdx.json
          syft "${packages[0]}" -o "spdx-json=$input"
          python engineering/tools/release_bundle.py bind-sbom \
            --artifact "${packages[0]}" --input "$input" \
            --metadata dist/release-candidate/build-metadata.json \
            --output "${packages[0]}.spdx.json"
          python engineering/tools/release_bundle.py validate-sbom \
            "${packages[0]}.spdx.json"
          python engineering/tools/release_evidence.py --require-ci \
            build/release-input-freebsd/freebsd-package-evidence.json
      - name: Upload native FreeBSD package and evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-input-${{ github.sha }}-freebsd-package
          path: build/release-input-freebsd/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  openbsd-package-evidence:
