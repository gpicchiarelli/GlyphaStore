name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "41 2 * * 3"

permissions:
  actions: read
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install --disable-pip-version-check cmake ninja
      - uses: github/codeql-action/init@v4
        with:
          languages: c-cpp
          build-mode: manual
      - name: Build
        run: |
          cmake --preset unix-debug
          cmake --build --preset unix-debug
      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          output: codeql-results
          upload: false
          upload-database: false
      - name: Preserve SARIF report
        uses: actions/upload-artifact@v7
        with:
          name: codeql-sarif
          path: codeql-results/*.sarif
          retention-days: 14
