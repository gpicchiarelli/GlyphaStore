name: Ops runbooks and soak

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      soak_seconds:
        description: Soak duration in seconds (smoke default 45; long e.g. 1800). Multi-hour 1h/4h → soak-extended.yml
        required: false
        default: "45"
  schedule:
    # Weekly longer soak; CI-friendly 30 minutes, not multi-hour hardware certification.
    # Multi-hour profiles: .github/workflows/soak-extended.yml (workflow_dispatch / monthly 1h).
    - cron: "17 4 * * 1"

permissions:
  contents: read

concurrency:
  group: ops-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  runbooks:
    name: Exercise ops runbooks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install build tools
        run: |
          python -m pip install --disable-pip-version-check cmake ninja
          sudo apt-get update
          sudo apt-get install -y lsof
      - name: Configure and build ops binaries
        env:
          CC: clang
          CXX: clang++
        run: |
          cmake --preset unix-debug
          cmake --build --preset unix-debug --target \
            glyphastored \
            glyphastore_interop_client \
            glyphastore_verify_store \
            glyphastore_backup_store \
            glyphastore_repair_store
      - name: Exercise backup / drain / corruption runbooks
        env:
          GLYPHASTORED: ${{ github.workspace }}/build/unix-debug/glyphastored
          GLYPHASTORE_INTEROP_CLIENT: ${{ github.workspace }}/build/unix-debug/glyphastore_interop_client
          GLYPHASTORE_VERIFY_STORE: ${{ github.workspace }}/build/unix-debug/glyphastore_verify_store
          GLYPHASTORE_BACKUP_STORE: ${{ github.workspace }}/build/unix-debug/glyphastore_backup_store
          GLYPHASTORE_REPAIR_STORE: ${{ github.workspace }}/build/unix-debug/glyphastore_repair_store
        run: ./scripts/exercise_ops_runbooks.sh

  soak:
    name: Durable daemon soak
    runs-on: ubuntu-latest
    needs: runbooks
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install build tools
        run: |
          python -m pip install --disable-pip-version-check cmake ninja
          sudo apt-get update
          sudo apt-get install -y lsof
      - name: Configure and build soak binaries
        env:
          CC: clang
          CXX: clang++
        run: |
          cmake --preset unix-debug
          cmake --build --preset unix-debug --target glyphastored glyphastore_interop_client
      - name: Resolve soak duration
        id: soak
        run: |
          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            echo "seconds=1800" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "seconds=${{ inputs.soak_seconds }}" >> "$GITHUB_OUTPUT"
          else
            echo "seconds=45" >> "$GITHUB_OUTPUT"
          fi
      - name: Run soak
        env:
          GLYPHASTORED: ${{ github.workspace }}/build/unix-debug/glyphastored
          GLYPHASTORE_INTEROP_CLIENT: ${{ github.workspace }}/build/unix-debug/glyphastore_interop_client
          SOAK_SECONDS: ${{ steps.soak.outputs.seconds }}
        run: ./scripts/soak_daemon.sh --seconds "$SOAK_SECONDS"
