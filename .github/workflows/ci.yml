name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: ${{ matrix.os }} / ${{ matrix.compiler }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            compiler: gcc
            cc: gcc
            cxx: g++
          - os: ubuntu-latest
            compiler: clang
            cc: clang
            cxx: clang++
          - os: macos-latest
            compiler: apple-clang
            cc: clang
            cxx: clang++
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install build tools
        run: python -m pip install --disable-pip-version-check cmake ninja
      - name: Configure
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: cmake --preset unix-debug
      - name: Build
        run: cmake --build --preset unix-debug
      - name: Test
        run: ctest --preset unix-debug
      - name: Verify format fixtures
        run: python scripts/generate_format_fixtures.py --verify tests/fixtures

  install-consumer:
    name: Release install / external consumer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install build tools
        run: python -m pip install --disable-pip-version-check cmake ninja
      - name: Configure release
        env:
          CC: clang
          CXX: clang++
        run: >-
          cmake --preset unix-release
          -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/build/install-prefix
      - name: Build and install
        run: |
          cmake --build --preset unix-release
          cmake --install build/unix-release
      - name: Configure external consumer
        run: >-
          cmake -S tests/consumer -B build/consumer -G Ninja
          -DCMAKE_PREFIX_PATH=${{ github.workspace }}/build/install-prefix
      - name: Build and test external consumer
        run: |
          cmake --build build/consumer
          ctest --test-dir build/consumer --output-on-failure
