name: Assurance

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: assurance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-assurance:
    name: Validate requirements hazards gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install validator dependencies
        run: python -m pip install --disable-pip-version-check PyYAML jsonschema
      - name: Validate assurance catalog
        run: python engineering/tools/validate_assurance.py
      - name: Validate durability certification honesty
        run: python engineering/tools/validate_durability_claims.py
