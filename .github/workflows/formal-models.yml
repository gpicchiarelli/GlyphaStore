name: Formal models (TLC)

on:
  push:
    branches: [main]
    paths:
      - "engineering/formal/**"
      - "engineering/requirements/concurrency.yaml"
      - "engineering/requirements/persistence.yaml"
      - "engineering/gates/quality-gates.yaml"
      - "include/glyphastore/persistence/**"
      - "include/glyphastore/store/paired/**"
      - "src/persistence/**"
      - "src/store/paired/**"
      - "tests/crash/**"
      - "tests/concurrency/**"
      - "docs/spec/concurrency-memory-model.md"
      - "docs/spec/persistence-v1.md"
      - "docs/spec/recovery-state-matrix-v1.md"
      - ".github/workflows/formal-models.yml"
  pull_request:
    paths:
      - "engineering/formal/**"
      - "engineering/requirements/concurrency.yaml"
      - "engineering/requirements/persistence.yaml"
      - "engineering/gates/quality-gates.yaml"
      - "include/glyphastore/persistence/**"
      - "include/glyphastore/store/paired/**"
      - "src/persistence/**"
      - "src/store/paired/**"
      - "tests/crash/**"
      - "tests/concurrency/**"
      - "docs/spec/concurrency-memory-model.md"
      - "docs/spec/persistence-v1.md"
      - "docs/spec/recovery-state-matrix-v1.md"
      - ".github/workflows/formal-models.yml"
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: formal-models-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tlc:
    name: TLC ${{ matrix.label }} (bounded, required)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: ShardPair
            model: shard_pair
          - label: PersistenceRecovery
            model: persistence
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "21"
      - name: Download and verify tla2tools.jar
        run: |
          curl -fsSL -o /tmp/tla2tools.jar \
            "https://github.com/tlaplus/tlaplus/releases/download/v1.8.0/tla2tools.jar"
          echo "eabd140a70f49eb9305a3bd3f3df944eddf87e5a90d329789085f8953a80533a  /tmp/tla2tools.jar" \
            | sha256sum -c -
          echo "TLA2TOOLS_JAR=/tmp/tla2tools.jar" >> "$GITHUB_ENV"
      - name: Run bounded TLC model
        run: timeout 480 "./engineering/formal/${{ matrix.model }}/run-tlc.sh"
