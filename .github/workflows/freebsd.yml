name: FreeBSD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: freebsd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  freebsd:
    name: FreeBSD / native build+test
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build and test on FreeBSD
        uses: vmactions/freebsd-vm@83b151f58c6047089f4c80eb5ba2039d158ce093 # v1
        with:
          release: "14.3"
          arch: x86_64
          usesh: true
          copyback: true
          sync: rsync
          mem: 8192
          cache-after-prepare: true
          prepare: |
            pkg install -y cmake ninja git bash openssl pkgconf
          run: |
            set -e
            mkdir -p engineering/evidence/native-ci
            chmod +x scripts/ci-freebsd.sh
            bash -o pipefail -c \
              'bash scripts/ci-freebsd.sh 2>&1 | tee engineering/evidence/native-ci/freebsd.log'
            rm -rf build
      - name: Retain native FreeBSD log
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: freebsd-native-${{ github.sha }}
          path: engineering/evidence/native-ci/freebsd.log
          if-no-files-found: error
          retention-days: 14
