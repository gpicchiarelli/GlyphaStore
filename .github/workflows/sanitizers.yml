name: Sanitizers

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
    inputs:
      fuzz_seconds:
        description: "Wall-clock seconds per libFuzzer target"
        required: false
        default: "120"

permissions:
  contents: read

concurrency:
  group: sanitizers-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  sanitizer:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ASan + UBSan
            preset: unix-asan
          - name: TSan
            preset: unix-tsan
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
      - run: python -m pip install --disable-pip-version-check cmake ninja
      - name: Configure
        env:
          CC: clang
          CXX: clang++
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}
      - name: Test
        run: ctest --preset ${{ matrix.preset }}

  fuzz-run:
    name: libFuzzer / ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target:
          - record_decoder
          - segment_scanner
          - index_rebuild
          - protocol_decoder
          - store_state_machine
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
      - run: python -m pip install --disable-pip-version-check cmake ninja
      - name: Resolve fuzz time budget
        id: budget
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "seconds=${{ inputs.fuzz_seconds }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "schedule" ]; then
            echo "seconds=120" >> "$GITHUB_OUTPUT"
          else
            echo "seconds=60" >> "$GITHUB_OUTPUT"
          fi
      - name: Configure fuzz targets
        env:
          CC: clang
          CXX: clang++
        run: cmake --preset unix-fuzz
      - name: Build fuzz targets
        run: cmake --build --preset unix-fuzz --target fuzz_${{ matrix.target }}
      - name: Run fuzzer
        env:
          GLYPHASTORE_FUZZ_BUILD_DIR: ${{ github.workspace }}/build/unix-fuzz
          GLYPHASTORE_FUZZ_TARGET: ${{ matrix.target }}
          GLYPHASTORE_FUZZ_SECONDS: ${{ steps.budget.outputs.seconds }}
        run: |
          chmod +x scripts/run-fuzzers.sh
          bash scripts/run-fuzzers.sh
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: fuzz-artifacts-${{ matrix.target }}-${{ github.run_id }}
          path: build/unix-fuzz/fuzz-artifacts/
          if-no-files-found: ignore
          retention-days: 30
