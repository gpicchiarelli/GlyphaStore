name: Sanitizers

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  sanitizer:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ASan + UBSan
            preset: unix-asan
          - name: TSan
            preset: unix-tsan
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install --disable-pip-version-check cmake ninja
      - name: Configure
        env:
          CC: clang
          CXX: clang++
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}
      - name: Test
        run: ctest --preset ${{ matrix.preset }}

  fuzz-build:
    name: Clang libFuzzer build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install --disable-pip-version-check cmake ninja
      - name: Configure fuzz targets
        env:
          CC: clang
          CXX: clang++
        run: cmake --preset unix-fuzz
      - name: Build fuzz targets
        run: cmake --build --preset unix-fuzz
