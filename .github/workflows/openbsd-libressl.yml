name: OpenBSD LibreSSL

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: openbsd-libressl-${{ github.ref }}
  cancel-in-progress: true

jobs:
  openbsd-libressl:
    name: OpenBSD / LibreSSL TLS gate
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      - name: Build and test on OpenBSD with system LibreSSL
        uses: vmactions/openbsd-vm@v1
        with:
          release: "7.9"
          arch: x86_64
          usesh: true
          copyback: false
          sync: rsync
          mem: 8192
          cache-after-prepare: true
          prepare: |
            pkg_add -I cmake ninja git go bash
          run: |
            set -e
            chmod +x scripts/ci-openbsd-libressl.sh
            bash scripts/ci-openbsd-libressl.sh
