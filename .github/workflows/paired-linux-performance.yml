name: Paired Linux hard-pinned A/B

# Manual only. Does not run on push/PR. Hosted ubuntu-latest cannot close this
# gate; requires a self-hosted runner labeled glyphastore-linux-perf.
on:
  workflow_dispatch:
    inputs:
      pairs:
        description: "Shard-pair counts (space-separated)"
        required: false
        default: "1 2 4 8"
      pipelines:
        description: "Pipeline depths"
        required: false
        default: "1 8 32"
      repeats:
        description: "Measured repeats per cell"
        required: false
        default: "7"

permissions:
  actions: read
  contents: read

jobs:
  paired-linux-ab:
    name: Linux hard-pinned paired A/B
    runs-on: [self-hosted, linux, glyphastore-linux-perf]
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7

      - name: Guard runner label honesty
        run: |
          echo "runner=${RUNNER_NAME:-unknown}"
          echo "os=$(uname -srm)"
          command -v taskset
          command -v numactl
          command -v perf
          command -v lscpu

      - name: Install build tools
        run: |
          if ! command -v cmake >/dev/null 2>&1; then
            python -m pip install --disable-pip-version-check cmake ninja
          fi

      - name: Configure and build Release
        env:
          CC: clang
          CXX: clang++
        run: |
          cmake --preset unix-release
          cmake --build --preset unix-release --target glyphastore_server_benchmarks

      - name: Run hard-pinned matrix
        env:
          PAIRS: ${{ inputs.pairs }}
          PIPELINES: ${{ inputs.pipelines }}
          BENCHMARK_REPEATS: ${{ inputs.repeats }}
          BENCHMARK_PRESET: unix-release
          REQUIRE_LINUX_TOOLS: "1"
          # Operators must set SERVER_CPUS / CLIENT_CPUS / NUMA_NODE on the runner
          # environment (machine-specific). Missing sets mark the run inconclusive.
        run: ./scripts/benchmark_paired_linux_ab.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: paired-linux-ab-${{ github.sha }}
          path: benchmark-results/paired-shards/
          if-no-files-found: error
          retention-days: 90
