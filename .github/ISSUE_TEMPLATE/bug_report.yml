name: Bug report
description: Report a reproducible GlyphaStore defect
title: "bug: "
labels: [bug]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened, and what should have happened?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Include the smallest commands, test, or code sample that reproduces the issue.
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Commit
      placeholder: git rev-parse HEAD
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, architecture, compiler/Xcode, CMake preset, and sanitizer configuration.
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: Logs, stack traces, sanitizer output, and relevant segment metadata. Remove secrets.
